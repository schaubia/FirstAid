<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Първа помощ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Първа помощ · First Aid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --ink:#13201B; --muted:#51605A; --line:#CBD5D1; --red:#C8102E; --teal:#11695A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #FFFFFF; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
  button { font: inherit; color: inherit; }

  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .brand { flex:1; font-weight:700; font-size:22px; display:flex; align-items:center; gap:10px; }
  .logo { width:30px; height:30px; border-radius:7px; background:var(--red); color:#fff;
    display:grid; place-items:center; font-size:22px; font-weight:700; line-height:1; }
  a.call { background:var(--red); color:#fff; text-decoration:none; font-weight:700;
    font-size:20px; padding:10px 18px; border-radius:999px; white-space:nowrap; }
  .lang { display:flex; gap:6px; margin-bottom:12px; }
  .lang button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font-size:15px; }
  .lang button.on { background:var(--ink); color:#fff; border-color:var(--ink); }

  .big { display:block; width:100%; min-height:64px; font-size:19px; font-weight:700; text-align:left;
    border:1px solid var(--line); border-radius:10px; background:#fff; padding:12px 14px; margin:0 0 8px; cursor:pointer; }
  .big:active { background:#EEF2F0; }
  .big.primary { background:var(--red); border-color:var(--red); color:#fff; }
  .back { min-height:48px; font-size:17px; width:auto; padding:8px 14px; }

  input.search { width:100%; font-size:18px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; margin:4px 0 4px; }
  .warn { background:#FCEFD9; border-radius:10px; padding:12px 14px; margin-top:10px; font-size:17px; }
  .group { font-size:16px; font-weight:700; color:var(--muted); margin:22px 0 8px; display:flex; align-items:center; gap:8px; }
  .group i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tiles .big { margin:0; font-size:17px; min-height:64px; }
  @media (max-width: 340px) { .tiles { grid-template-columns:1fr; } }

  .tq { font-size:26px; font-weight:700; line-height:1.25; margin:10px 0 6px; }
  .tq-hint { font-size:18px; color:var(--muted); margin-bottom:12px; }

  .dhead { border-left:8px solid var(--c); padding:4px 0 4px 14px; margin:8px 0 16px; }
  .dhead h1 { font-size:30px; line-height:1.15; margin:0; }
  .dhead p { margin:6px 0 0; color:var(--muted); font-size:18px; }
  .urgent { display:flex; gap:12px; align-items:center; background:#FBE7EA; border-radius:12px;
    padding:12px 14px; margin-bottom:12px; font-weight:700; font-size:18px; }
  .urgent a.call { margin-left:auto; font-size:17px; padding:8px 14px; }
  .beat { display:flex; align-items:center; gap:12px; background:#DDF0EB; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:16px; }
  .beat button { border:0; background:var(--teal); color:#fff; font-weight:700; border-radius:10px; padding:10px 16px; min-height:44px; font-size:16px; }
  .beat .dot { width:18px; height:18px; border-radius:50%; background:var(--teal); opacity:.25; flex:none; }
  .modes { display:flex; gap:8px; margin:4px 0 12px; }
  .modes button { flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px; font-size:16px; font-weight:700; }
  .modes button.on { background:var(--ink); color:#fff; border-color:var(--ink); }

  .step { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .step label { display:flex; gap:10px; align-items:flex-start; font-size:20px; font-weight:700; cursor:pointer; }
  .step input { width:24px; height:24px; margin-top:2px; flex:none; accent-color:var(--teal); }
  .step.done label { color:var(--muted); text-decoration:line-through; }
  .stepdesc { color:var(--muted); font-size:17px; margin:6px 0 0 34px; line-height:1.4; }
  .pic img { width:100%; max-width:340px; display:block; margin:8px 0 2px; }
  .guide .count { color:var(--muted); font-weight:700; }
  .guide .num { font-size:72px; font-weight:700; line-height:1; color:var(--c); margin:8px 0; }
  .guide .title { font-size:26px; font-weight:700; line-height:1.25; }
  .guide .desc { font-size:18px; color:var(--muted); margin-top:10px; line-height:1.4; }
  .nav { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .nav button { min-height:56px; font-size:18px; font-weight:700; border-radius:10px; border:1px solid var(--line); background:#fff; }
  .nav button.primary { background:var(--red); border-color:var(--red); color:#fff; }
  .nav button:disabled { opacity:.35; }

  .box { border-radius:12px; padding:14px 16px; margin-top:14px; font-size:17px; line-height:1.4; }
  .box h3 { margin:0 0 6px; font-size:18px; }
  .box ul { margin:0; padding-left:20px; }
  .box.red { background:#FBE7EA; }
  .box.amber { background:#FCEFD9; }
  .note { margin-top:28px; font-size:15px; color:var(--muted); line-height:1.4; }
</style>
</head>

<main id="app"></main>
<script id="data" type="application/json">{"cards":{"en":[{"id":"cpr","sev":"red","title":"Not breathing (adult)","sub":"Unresponsive, no normal breathing","recognize":"Doesn't respond when you shout and tap the shoulders, and isn't breathing normally (gasping doesn't count).","call":true,"metronome":true,"steps":[["Make sure it's safe","Check for traffic, electricity, fire, gas before you approach.",null],["Check response","Tap the shoulders firmly and shout: “Are you OK?”",null],["Open the airway, check breathing","Tilt the head back, lift the chin. Look, listen and feel for normal breathing for up to 10 seconds.",null],["Call 112 on speaker","Stay with the person. Send someone to bring an AED (defibrillator) if there is one nearby.",null],["Push hard and fast","Heel of your hand in the centre of the chest, other hand on top, arms straight. Press 5-6 cm deep, 100-120 times a minute. Let the chest rise fully between pushes.","cpr_adult"],["30 pushes, then 2 breaths","If trained: tilt head, pinch nose, 2 breaths of 1 second each. If not trained or unwilling: just keep pushing without stopping.",null],["Use the AED as soon as it arrives","Switch it on and follow the spoken instructions. Keep pushing while the pads are being placed.",null],["Don't stop","Continue until help takes over, the person starts breathing normally, or you are physically unable to go on. Swap with another person every 2 minutes if possible.",null]],"when":["Always - call 112 immediately"],"dont":["Don't stop compressions to check for a pulse","Don't be afraid of hurting them - broken ribs heal, cardiac arrest doesn't"]},{"id":"choking","sev":"red","title":"Choking (adult)","sub":"Adult or teenager","recognize":"Suddenly can't speak, cough or breathe; often grabs the throat.","call":false,"metronome":false,"steps":[["Ask “Are you choking?”","If they can cough strongly, encourage them to keep coughing and stay with them.",null],["Up to 5 back blows","Stand to the side, lean them forward, support the chest. Give firm blows between the shoulder blades with the heel of your hand. Check after each blow.","back_blows"],["Up to 5 abdominal thrusts","Stand behind, fist just above the belly button, other hand over it. Pull sharply inward and upward. Check after each thrust.","abdominal"],["Repeat","Alternate 5 back blows and 5 thrusts until the object comes out.",null],["Call 112 if it isn't cleared","Keep going while someone calls.",null],["If they become unresponsive","Lower them to the ground, call 112, and start CPR (see ‘Not breathing’).",null]],"when":["Object not cleared after 3 rounds","They become unresponsive","After any abdominal thrusts - they need a medical check"],"dont":["Don't do blind finger sweeps in the mouth","Don't hit the back of someone who is coughing effectively"]},{"id":"drowning","sev":"red","title":"Drowning","sub":"Pulled from the water","recognize":"Person pulled from water who is unresponsive, not breathing normally, or coughing and struggling to breathe.","call":true,"metronome":true,"steps":[["Don't become a second victim","Reach with a pole or throw something that floats. Only go into the water if you are trained and it's safe.",null],["Get them out and call 112","Keep them lying flat. Put the phone on speaker.",null],["Open the airway, check breathing","Tilt the head back, lift the chin. Look, listen and feel for up to 10 seconds.",null],["Not breathing? Give 5 rescue breaths first","Pinch the nose, 5 breaths of 1 second each. Drowning is a breathing problem, so breaths matter more than in other collapses.",null],["Then CPR: 30 compressions, 2 breaths","Centre of the chest, 5-6 cm deep, 100-120 a minute. For a child or baby, use the child or baby card.","cpr_adult"],["If they vomit","Turn them on their side, let it drain, clear the mouth, then continue.",null],["Breathing? Recovery position, keep warm","Remove wet clothes if you can and cover them. Keep checking breathing.","recovery"]],"when":["Always - even if they seem fine; breathing problems can develop hours later"],"dont":["Don't try to get water out of the lungs - no abdominal thrusts, no hanging upside down","Don't swim out unless you are trained"]},{"id":"bleeding","sev":"red","title":"Severe bleeding","sub":"Blood spurting or soaking through","recognize":"Blood is pumping or flowing fast, or soaking through clothes.","call":true,"metronome":false,"steps":[["Protect yourself","Use gloves or a plastic bag over your hand if available.",null],["Press hard on the wound","Use a clean cloth, bandage or your hand. Press firmly and don't let go.",null],["Call 112","Or get someone else to call while you keep pressing.",null],["Keep pressing for at least 10 minutes","If blood soaks through, add more cloth on top - don't remove the first layer.",null],["Bandage firmly","Once bleeding slows, wrap tightly over the pad. Check fingers/toes stay warm and pink.",null],["Tourniquet for limb bleeding that won't stop","Only for arms/legs: 5-7 cm above the wound, tighten until bleeding stops, note the time.",null],["Lay them down, keep warm","Watch for pale, cold, clammy skin and confusion - signs of shock.",null]],"when":["Bleeding doesn't stop with pressure","Spurting blood","Deep wound, or something stuck in it"],"dont":["Don't remove an object stuck in the wound - press around it","Don't lift the pad to check"]},{"id":"amputation","sev":"red","title":"Severed finger or limb","sub":"Cut off or torn off","recognize":"A finger, toe, hand or part of an arm or leg has been cut or torn off - by a saw, a machine, a door, a garden tool or in an accident. There may be heavy bleeding.","call":true,"metronome":false,"steps":[["Make it safe","Switch off the machine or the power. Use gloves or a plastic bag over your hand if you can.",null],["Call 112","Say that a body part has been cut off.",null],["Stop the bleeding","Press hard on the wound with a clean cloth and raise it. Heavy bleeding from an arm or leg that won't stop with pressure: tourniquet 5-7 cm above the wound, note the time (see ‘Severe bleeding’).",null],["Lay them down, keep warm","Watch for pale, cold, clammy skin and confusion - signs of shock.",null],["Find the severed part","Don't wash or scrub it. If it is very dirty, rinse it briefly with clean water.",null],["Wrap it and seal it in a bag","Wrap the part in clean, slightly damp gauze or cloth. Put it in a clean plastic bag and seal it.",null],["Keep it cold, but not on ice","Put the sealed bag into a second bag or container with ice and a little water. The part must never touch ice or water directly - frozen or soaked tissue can't be reattached. Write the name and the time on the bag.",null],["Send it with the person","Give it to the paramedics. Reattachment works best when the part arrives cold and as early as possible.",null],["Partly cut off?","If the part still hangs on by skin, don't cut it off. Put it back in its normal position, cover it with a damp dressing and support it.",null]],"when":["Always - any cut-off or torn-off body part"],"dont":["Don't put the part directly on ice or in water, and never freeze it","Don't wash or scrub the part","Don't cut off a part that is still hanging on","Don't give food or drink - they will probably need surgery"]},{"id":"allergy","sev":"red","title":"Severe allergic reaction","sub":"Anaphylaxis","recognize":"Fast swelling of lips, tongue or throat, difficulty breathing, wheezing, hives, dizziness - often after food, a sting or medicine.","call":true,"metronome":false,"steps":[["Use their adrenaline auto-injector","Outer thigh, through clothes if needed. Follow the instructions on the pen.",null],["Call 112","Say “anaphylaxis”.",null],["Position","Lie them down with legs raised. If breathing is hard, let them sit up. Don't make them stand or walk.",null],["Second dose after 5 minutes","If there's no improvement and a second pen is available.",null],["Watch breathing","If they become unresponsive and stop breathing normally, start CPR.",null]],"when":["Always, even if the pen works - symptoms can return"],"dont":["Don't wait to see if it gets worse","Don't make them stand up suddenly"]},{"id":"electric","sev":"red","title":"Electric shock","sub":"Electricity, lightning","recognize":"Person found near a cable, socket or appliance, or after lightning; may be unresponsive, burned, confused.","call":true,"metronome":false,"steps":[["Don't touch them yet","While they are still in contact with the current, the electricity can pass to you.",null],["Switch off the power","Unplug the appliance or switch off at the fuse box.",null],["Can't switch off? Push away with something dry","Stand on dry wood, rubber or a thick book. Use a dry wooden broom or chair to move the cable or the person. Only for household electricity.",null],["Power lines: stay back","Keep at least 18 metres away and call 112. Don't approach until the power company says it's off.",null],["Call 112","Every serious electric shock needs a hospital check, even if they seem fine.",null],["Check breathing","Not breathing: start CPR and use an AED. Breathing: recovery position.",null],["Cool burns","Cool entry and exit burns under running water for 20 minutes, then cover loosely.",null]],"when":["High voltage or lightning","Any loss of consciousness","Burns","Chest pain, irregular heartbeat, confusion","Pregnant"],"dont":["Don't touch the person until the power is off","Don't use anything wet or metal","Don't go near fallen power lines"]},{"id":"accident","sev":"red","title":"Road accident","sub":"Car, motorbike, pedestrian hit","recognize":"A crash involving a car, motorbike, bicycle or pedestrian. People may be injured, trapped, unconscious or bleeding, and there may be traffic, fuel or fire.","call":true,"metronome":false,"steps":[["Make yourself safe first","Stop well away from the crash, switch on the hazard lights and put on a reflective vest. Place the warning triangle well behind the scene - at least 30 m, further on fast roads. Watch out for traffic.",null],["Call 112","Say exactly where you are (road, direction, kilometre sign or landmark), how many vehicles and injured people there are, and whether anyone is trapped, or there's fire or leaking fuel.",null],["Make the vehicles safe","Switch off the engines if you can. No smoking. If there's fire or a strong smell of fuel, keep everyone away.",null],["Don't move the injured","Unless they are in immediate danger, such as fire or traffic. Assume a neck or back injury: ask them to stay still and hold the head in line with the body.",null],["Help the most serious first","Not breathing: start CPR (see ‘Not breathing’). Heavy bleeding: press hard on the wound. Unconscious but breathing in a seat: support the head and keep the airway open - move them only if the airway is at risk.",null],["Motorcyclist: leave the helmet on","Remove it only if they aren't breathing and you can't open the airway otherwise - ideally with two people, keeping the head and neck in line.",null],["Keep them warm and stay with them","Cover them with a coat or blanket, talk to them calmly, and watch their breathing until help arrives.",null]],"when":["Always - anyone injured, trapped or unconscious needs an ambulance"],"dont":["Don't move the injured unless there's immediate danger","Don't remove a motorcycle helmet unless it's needed to help them breathe","Don't give food or drink","Don't stand or run in the traffic lanes"]},{"id":"spine","sev":"red","title":"Neck or back injury","sub":"Spine: fall, diving, crash","recognize":"After a fall from height, a dive into shallow water, a car or motorbike crash, or a hard blow to the head or back. Pain in the neck or back, numbness, tingling or weakness in the arms or legs - or unconscious after such an accident.","call":true,"metronome":false,"steps":[["Make sure it's safe","Watch for traffic, water, falling objects. Only move the person if they are in immediate danger.",null],["Call 112","Say you suspect a neck or back injury and how it happened.",null],["Tell them not to move","“Keep your head still, help is coming.” Reassure them - many people instinctively try to sit up.",null],["Hold the head still","Kneel at their head. Put your hands on both sides of the head, over the ears, and keep it in line with the body - don't pull. Keep holding until help takes over. If you need your hands, put rolled clothes or towels on both sides of the head.",null],["Leave them as you found them","Don't straighten them out. If you must move them because of danger, keep the head, neck and body in one straight line - ideally with several people turning together.",null],["Unresponsive? Breathing comes first","Open the airway by gently lifting the chin, moving the head as little as possible. Not breathing: start CPR. If they vomit, roll them onto the side, keeping head, neck and body in line.",null],["Diving accident in water","Keep the face out of the water and support the head and back in a straight line. Bring them to the shore or edge with help, keeping the body straight. Not breathing: get them out and see ‘Drowning’.",null],["Keep warm and keep watching","Cover them with a coat or blanket and keep checking their breathing until help arrives.",null]],"when":["Always - for any suspected neck or back injury","Numbness, tingling or weakness in the arms or legs","Unconscious after a fall, dive or crash"],"dont":["Don't move them unless they are in danger","Don't let them sit up, stand or walk “to test it”","Don't twist or bend the neck, and don't put a pillow under the head","Don't remove a motorcycle helmet unless it's needed to help them breathe","Don't give food or drink"]},{"id":"unconscious","sev":"red","title":"Unconscious but breathing","sub":"Recovery position","recognize":"Doesn't respond, but is breathing normally.","call":true,"metronome":false,"steps":[["Check breathing","Tilt the head back, lift the chin, and confirm normal breathing for up to 10 seconds.",null],["Call 112","Put the phone on speaker so your hands stay free.",null],["Roll onto the side","Arm nearest you at a right angle. Other hand against their cheek. Bend the far knee, pull it toward you so they roll onto their side.","recovery"],["Keep the airway open","Tilt the head back slightly so the mouth points down and fluids can drain.",null],["Keep checking breathing","Check every minute. If breathing stops, roll them on their back and start CPR (see ‘Not breathing’).",null],["Keep them warm","Cover with a coat or blanket until help arrives.",null]],"when":["Always - anyone unconscious needs an ambulance"],"dont":["Don't give food or drink","Don't leave them alone","Don't move them if you suspect a neck or spine injury - only roll if the airway is at risk"]},{"id":"shock","sev":"red","title":"Shock","sub":"Pale, cold, clammy after injury","recognize":"Pale, cold, clammy skin; fast, weak pulse; fast, shallow breathing; dizzy, weak, thirsty, anxious or confused - usually after heavy bleeding, a serious injury, burns, severe vomiting or diarrhoea, or an allergic reaction.","call":true,"metronome":false,"steps":[["Call 112","Shock can get worse quickly, even if they seem fine at first.",null],["Treat the cause","Stop any bleeding by pressing hard on the wound (see ‘Severe bleeding’). For a severe allergic reaction, use their adrenaline pen (see ‘Severe allergic reaction’).",null],["Lay them down","Flat on their back, on a blanket or coat if possible.",null],["Raise the legs","Lift the legs slightly if there's no injury to the legs, hips, neck or back and it doesn't cause pain. Don't do it if breathing gets harder.",null],["Keep them warm","Cover with a coat or blanket. Loosen tight clothing at the neck, chest and waist.",null],["Reassure and monitor","Stay with them, keep them calm, and check their breathing and response regularly.",null],["If unresponsive","Breathing: recovery position. Not breathing normally: start CPR (see ‘Not breathing’).",null]],"when":["Always - shock is a medical emergency"],"dont":["Don't give food or drink - they may need surgery; wet the lips if they're thirsty","Don't let them get up or walk around","Don't leave them alone","Don't use a hot-water bottle or heater - just stop them losing heat"]},{"id":"heart","sev":"red","title":"Heart attack","sub":"Chest pain or pressure","recognize":"Pain, pressure or tightness in the chest, possibly spreading to arm, jaw, neck or back. Sweating, nausea, shortness of breath.","call":true,"metronome":false,"steps":[["Call 112","Say you suspect a heart attack.",null],["Sit them down","Half-sitting, knees bent, leaning against something. Loosen tight clothes.",null],["Aspirin","If not allergic and not told by a doctor to avoid it: one adult aspirin (150-300 mg), chewed slowly.",null],["Their own medicine","If they carry nitroglycerin spray/tablets, help them take it.",null],["Stay and monitor","Keep them calm. If they become unresponsive and stop breathing normally, start CPR (see ‘Not breathing’).",null]],"when":["Always - don't wait to see if it passes"],"dont":["Don't let them walk or drive to hospital","Don't give aspirin to children"]},{"id":"stroke","sev":"red","title":"Stroke","sub":"Face, arm or speech problems","recognize":"F.A.S.T. - Face drooping on one side, Arm weakness (can't lift both), Speech slurred or confused, Time to call.","call":true,"metronome":false,"steps":[["Check F.A.S.T.","Ask them to smile, raise both arms, and repeat a simple sentence.",null],["Call 112 immediately","Say “stroke” - every minute counts.",null],["Note the time","Remember when symptoms started or when they were last seen well. Doctors need this.",null],["Keep them comfortable","Sitting or lying with head and shoulders slightly raised. Reassure them.",null],["If unresponsive","Put in the recovery position if breathing; start CPR if not.",null]],"when":["Any one F.A.S.T. sign - even if it goes away"],"dont":["Don't give food, drink or medicine","Don't wait for symptoms to improve"]},{"id":"birth","sev":"red","title":"Emergency childbirth","sub":"Baby coming before help arrives","recognize":"Strong contractions every 2-3 minutes or more often, an urge to push, the waters have broken, or the baby's head can be seen. There may be no time to reach a hospital.","call":true,"metronome":false,"steps":[["Call 112","Say a baby is coming. Put the phone on speaker - the operator will guide you step by step.",null],["Prepare","Wash your hands, use gloves if you have them. Get clean towels or sheets and a blanket for the baby. Make the room warm.",null],["Help the mother into position","Half-sitting, propped up with pillows, or lying on her side - whatever is most comfortable. A clean sheet or towel under her hips.",null],["Support the head, don't pull","As the head comes out, support it gently with your palm and let it come slowly. Ask her to pant in short breaths instead of pushing hard. If the cord is around the neck and loose, gently slip it over the head.",null],["Catch the body","The shoulders and body usually slide out with the next contraction. Support the baby - it is slippery. Never pull on the baby or the cord.",null],["Dry and warm the baby","Put the baby skin-to-skin on the mother's chest, dry it well with a towel and cover both, including the baby's head. Wipe the mouth and nose if needed.",null],["Check the baby breathes","The baby should cry or breathe within about 1 minute. If not, rub the back and soles firmly. Still not breathing: start baby CPR (see ‘Not breathing (baby)’).",null],["Leave the cord and the placenta","Don't cut the cord. The placenta usually comes out within 30 minutes - don't pull it; keep it in a bowl or bag for the paramedics. Note the time of birth.",null],["Heavy bleeding after birth?","Some bleeding is normal. If it is heavy, firmly massage the lower belly just below the belly button, where the womb feels like a firm ball, and let the baby breastfeed - both help the womb contract.",null]],"when":["Always - call 112 as soon as the birth seems close","Baby not breathing, limp or blue after 1 minute","Heavy bleeding from the mother, soaking towels","A foot, the bottom or the cord comes out first","Baby born early, or the mother has a seizure"],"dont":["Don't pull the baby or the cord","Don't cut the cord","Don't try to hold the baby in or delay the birth","Don't pull out the placenta","Don't bathe the baby - keep it warm and dry"]},{"id":"heatstroke","sev":"red","title":"Heat stroke","sub":"Overheating, sunstroke","recognize":"Very hot body after heat or exercise, confused or behaving strangely, headache, dizziness, may collapse. Skin may be dry or sweaty.","call":true,"metronome":false,"steps":[["Call 112","Confusion in the heat is an emergency.",null],["Move to a cool place","Shade, an air-conditioned room, out of the sun.",null],["Remove extra clothing","Down to light underclothes.",null],["Cool fast","Best: put the body in cold water up to the neck. Otherwise soak them with cold water and fan hard, and put cold packs on the neck, armpits and groin.",null],["Sips of cool water","Only if fully alert and able to swallow.",null],["If unresponsive","Recovery position if breathing, CPR if not. Keep cooling.",null]],"when":["Confused, drowsy or collapsed","Seizure","Not better within 15 minutes of cooling"],"dont":["Don't give drinks if they are confused or vomiting","Don't give paracetamol or aspirin - they don't lower heat-stroke temperature","Don't stop cooling because they start shivering"]},{"id":"poisoning","sev":"red","title":"Poisoning","sub":"Swallowed, breathed in, on skin","recognize":"Swallowed medicine, chemicals, plants or mushrooms; breathed in gas or fumes; or chemicals on the skin or in the eyes. May be drowsy, vomiting, confused or in pain.","call":true,"metronome":false,"steps":[["Protect yourself","Gas or fumes: open windows, get them to fresh air, don't go in if it's unsafe. Wear gloves for chemicals.",null],["Call 112","Say what was taken, how much and when. Keep the packet, bottle or plant to show the paramedics.",null],["Chemicals on skin","Remove soaked clothes. Rinse the skin with lots of running water for at least 20 minutes.",null],["Chemicals in the eye","Rinse with running water for 15-20 minutes, holding the eye open.",null],["Swallowed something burning","Let them rinse the mouth with water and spit it out.",null],["If unresponsive","Recovery position if breathing. Not breathing: CPR - use compressions only if there's poison on the lips.",null]],"when":["Always for poisoning - the operator will advise"],"dont":["Don't make them vomit","Don't give milk, salt water or anything to drink unless told to","Don't give activated charcoal unless a doctor says so"]},{"id":"cpr-child","sev":"kids","title":"Not breathing (child)","sub":"Age 1 year to puberty","recognize":"Child doesn't respond when you speak loudly and tap them, and isn't breathing normally.","call":true,"metronome":true,"steps":[["Make sure it's safe","Check for traffic, water, electricity before you approach.",null],["Check response","Tap the child and speak loudly: “Are you OK?”",null],["Call 112 on speaker","Shout for help. If you have a phone, call 112 now and put it on speaker. No phone? Do 1 minute of CPR first, then go and call.",null],["Open the airway, check breathing","Tilt the head back gently and lift the chin. Look, listen and feel for normal breathing for up to 10 seconds.",null],["Give 5 rescue breaths","Pinch the nose, seal your mouth over theirs, blow steadily for about 1 second - just enough to make the chest rise.",null],["Give 15 chest compressions","Heel of one hand (or two hands for a bigger child) on the lower half of the breastbone. Press about 5 cm - one third of the chest depth - 100-120 times a minute.","cpr_child"],["Continue 2 breaths, 15 compressions","Keep repeating without long pauses. If you can't or won't give breaths, keep doing compressions only - it's much better than nothing.",null],["Use the AED as soon as it arrives","Switch it on and follow the voice. Use child pads or child mode if it has them; otherwise adult pads are fine.",null]],"when":["Always - call 112 immediately"],"dont":["Don't skip the 5 first breaths if you're able to give them - children usually stop breathing before the heart stops","Don't stop to check for a pulse"]},{"id":"cpr-infant","sev":"kids","title":"Not breathing (baby)","sub":"Under 1 year","recognize":"Baby is limp, doesn't react when you touch or speak to them, and isn't breathing normally.","call":true,"metronome":true,"steps":[["Check response","Speak loudly and gently tap the sole of the foot. Don't shake the baby.",null],["Call 112 on speaker","Shout for help. If you have a phone, call 112 now and put it on speaker. No phone? Do 1 minute of CPR first, then call - carry the baby with you if you can.",null],["Open the airway - head level","Lay the baby on their back on a firm surface. Keep the head in a neutral position (nose pointing up), not tilted back. Lift the chin with one finger.",null],["Check breathing","Look, listen and feel for normal breathing for up to 10 seconds.",null],["Give 5 rescue breaths","Cover the baby's mouth AND nose with your mouth. Give gentle puffs of about 1 second - just enough to make the chest rise.",null],["Give 15 chest compressions","Two fingers on the lower half of the breastbone (just below the nipple line). Press about 4 cm - one third of the chest depth - 100-120 times a minute.","cpr_infant"],["Continue 2 breaths, 15 compressions","Keep repeating. If you can't give breaths, keep doing compressions only.",null],["Use an AED if one arrives","Follow the voice. Use child pads or child mode if available - one pad on the chest, one on the back if the pads don't fit on the front.",null]],"when":["Always - call 112 immediately"],"dont":["Don't tilt the head far back - a baby's airway is soft and can close","Don't shake the baby","Don't blow hard - gentle puffs from your cheeks are enough"]},{"id":"choking-child","sev":"kids","title":"Choking (child)","sub":"Age 1 year to puberty","recognize":"Child suddenly can't speak, cry, cough or breathe; may turn red or blue, grab the throat.","call":false,"metronome":false,"steps":[["Is the cough strong?","If the child can cough loudly, encourage coughing and stay close. Don't hit the back.",null],["Shout for help, call 112 on speaker","Keep your hands free for the child.",null],["Up to 5 back blows","Kneel or stand behind/beside the child, lean them forward. Firm blows between the shoulder blades with the heel of your hand. Check after each blow.","back_blows"],["Up to 5 abdominal thrusts","Kneel or stand behind. Fist just above the belly button, other hand over it. Pull sharply inward and upward. Check after each thrust.","abdominal"],["Repeat","Alternate 5 back blows and 5 thrusts until the object comes out or the child becomes unresponsive.",null],["If the child becomes unresponsive","Lay them down and start CPR - see ‘Not breathing (child)’, starting with 5 breaths.",null]],"when":["Object doesn't come out quickly","Child becomes unresponsive","After any abdominal thrusts - the child needs a medical check"],"dont":["Don't do blind finger sweeps - you can push the object deeper; only remove it if you clearly see it","Don't hold the child upside down by the legs"]},{"id":"choking-infant","sev":"kids","title":"Choking (baby)","sub":"Under 1 year","recognize":"Baby suddenly can't cry, cough or breathe; silent, struggling, turning blue.","call":false,"metronome":false,"steps":[["Is the cough strong?","If the baby is coughing or crying loudly, let them cough and watch closely.",null],["Shout for help, call 112 on speaker","Keep your hands free for the baby.",null],["Up to 5 back blows","Lay the baby face down along your forearm, head lower than the body. Hold the jaw with your fingers (don't press the soft throat). Give firm blows between the shoulder blades with the heel of your hand.","back_blows_infant"],["Up to 5 chest thrusts","Turn the baby face up along your other forearm, head still lower. Two fingers on the lower half of the breastbone (same place as CPR). Push sharply down 5 times.","cpr_infant"],["Repeat","Alternate 5 back blows and 5 chest thrusts. Check the mouth - remove the object only if you can clearly see it.",null],["If the baby becomes unresponsive","Start CPR - see ‘Not breathing (baby)’, starting with 5 breaths.",null]],"when":["Object doesn't come out quickly","Baby becomes unresponsive","After any back blows or chest thrusts - the baby needs a medical check"],"dont":["Don't give abdominal thrusts to a baby - they can damage the organs","Don't do blind finger sweeps in the mouth","Don't hold the baby upside down by the legs or shake them"]},{"id":"febrile","sev":"kids","title":"Fever seizure (child)","sub":"Fit with high temperature, 6 months to 5 years","recognize":"A child aged 6 months to 5 years with a fever suddenly goes stiff, the eyes roll, arms and legs jerk, and the child doesn't respond. May turn pale or bluish. Usually stops within 1-2 minutes.","call":false,"metronome":false,"steps":[["Note the time","Check how long the seizure lasts. Stay calm - most fever seizures stop on their own and don't cause harm.",null],["Lay the child down safely","On a soft surface, on their side if you can, away from hard or sharp objects. Don't hold them down.",null],["Nothing in the mouth","Don't put fingers, a spoon or anything else in the mouth. The child can't swallow their tongue.",null],["Call 112 if needed","Call if it's the first seizure, it lasts more than 5 minutes, or the child struggles to breathe. If a doctor has given you emergency seizure medicine, use it as instructed.",null],["When the jerking stops","Put the child on their side (recovery position) and check breathing. They may be sleepy or confused for up to an hour.","recovery"],["Don't let them overheat","Remove extra clothes and blankets. Keep the room at a normal temperature.",null],["Fever medicine once fully awake","When the child is awake and can swallow, paracetamol or ibuprofen in the dose for their age or weight can make them more comfortable.",null],["See a doctor","Every fever seizure should be checked by a doctor, even a short one, to find the cause of the fever.",null]],"when":["First seizure ever","Lasts more than 5 minutes","Another seizure soon after","Breathing difficulty, or lips stay blue after the seizure","Doesn't wake up properly within an hour","Stiff neck, or a rash that doesn't fade when you press a glass on it","Baby younger than 6 months"],"dont":["Don't put anything in the mouth","Don't hold the child down or shake them","Don't put the child in a cold bath or rub with cold water or alcohol","Don't give food, drink or medicine by mouth until fully awake"]},{"id":"asthma","sev":"amber","title":"Asthma attack","sub":"Wheezing, can't catch breath","recognize":"Person with asthma who is wheezing, coughing, has a tight chest, and struggles to breathe or to speak in full sentences.","call":false,"metronome":false,"steps":[["Sit them upright","Sitting up, leaning slightly forward - not lying down. Loosen tight clothing and keep them calm.",null],["Help them use their reliever inhaler","Usually the blue one. Shake it, then 1 puff every 30-60 seconds, up to 10 puffs. Use a spacer if they have one.",null],["Slow breathing","Encourage slow, steady breaths. Stay calm yourself - panic makes breathing harder.",null],["No better after 10 puffs? Call 112","Call at once too if they are getting worse, too breathless to speak, or their lips turn blue.",null],["Repeat while you wait","If help hasn't arrived after 10 minutes, give up to 10 more puffs the same way.",null],["If they become unresponsive","Not breathing normally: start CPR (see ‘Not breathing’).",null]],"when":["No better after 10 puffs","Too breathless to speak, eat or sleep","Lips or fingertips turning blue or grey","Exhausted, drowsy or confused","No inhaler available and breathing is hard"],"dont":["Don't lay them down","Don't put a paper bag over their mouth","Don't leave them alone"]},{"id":"sugar","sev":"amber","title":"Low blood sugar","sub":"Diabetic emergency","recognize":"Known diabetic who is shaky, sweaty, pale, confused, irritable or unusually drowsy.","call":false,"metronome":false,"steps":[["Is the person awake and able to swallow?","If not - go to ‘Unconscious but breathing’ and call 112.",null],["Give fast sugar","Glucose tablets, a glass of juice or regular (not diet) soft drink, or a few sweets.",null],["Wait 10-15 minutes","Let them sit and rest.",null],["No better? Give sugar again","Repeat once.",null],["When they feel better","Give a snack with slower carbs - bread, biscuit, banana.",null]],"when":["Unconscious or can't swallow","No improvement after 2 doses of sugar","Seizure"],"dont":["Don't give food or drink to someone who can't swallow safely","Don't give insulin"]},{"id":"seizure","sev":"amber","title":"Seizure","sub":"Convulsions, fit","recognize":"Sudden stiffening and jerking movements, may fall, not aware of surroundings.","call":false,"metronome":false,"steps":[["Note the time","Check how long the seizure lasts.",null],["Protect from injury","Move hard or sharp objects away. Cushion the head with something soft.",null],["Let it happen","Don't hold them down. Loosen anything tight around the neck.",null],["After shaking stops","Check breathing and put them in the recovery position.","recovery"],["Stay with them","Talk calmly - they may be confused or sleepy for a while.",null]],"when":["Seizure lasts more than 5 minutes","Another seizure follows","First-ever seizure","Injured, pregnant, in water, or doesn't wake up"],"dont":["Don't put anything in their mouth","Don't restrain movements","Don't give food or drink until fully alert"]},{"id":"snakebite","sev":"amber","title":"Snake bite","sub":"Viper, adder","recognize":"Two small puncture marks, with pain, swelling and bruising spreading from the bite. Later there may be nausea, vomiting, dizziness, swelling of the face or trouble breathing. In Bulgaria the venomous snakes are vipers (пепелянка, усойница).","call":true,"metronome":false,"steps":[["Move away from the snake","Don't try to catch or kill it. If it's safe, take a photo from a distance - it helps the doctors.",null],["Call 112","Every viper bite needs a hospital check, even if it doesn't hurt much at first.",null],["Keep them still and calm","Sit or lay them down. Movement spreads the venom faster. Don't let them walk if they can be carried or picked up.",null],["Remove rings, watches and tight things","From the bitten arm or leg, before it swells - including shoes.",null],["Keep the limb still","Support it with a sling or splint, roughly at the level of the heart.",null],["Note the time and mark the swelling","Write down when the bite happened. Draw a line with a pen at the edge of the swelling and write the time next to it - doctors use this to see how fast it spreads.",null],["Watch for a serious reaction","Swelling of the face, trouble breathing or collapse: use the ‘Severe allergic reaction’ or ‘Shock’ card. Not breathing normally: start CPR.",null]],"when":["Always - every snake bite needs a hospital check","Child, elderly person, or bite on the face or neck","Swelling spreading fast, vomiting, dizziness, fainting or trouble breathing"],"dont":["Don't cut the wound or try to suck out the venom","Don't use a tourniquet or a tight bandage","Don't put ice on the bite","Don't give alcohol, aspirin or ibuprofen","Don't try to catch or kill the snake"]},{"id":"burn","sev":"amber","title":"Burns","sub":"Heat, hot water, fire","recognize":"Red, painful, blistered or white/charred skin.","call":false,"metronome":false,"steps":[["Stop the burning","Move away from the source. Remove from heat.",null],["Cool with running water for 20 minutes","Cool or lukewarm tap water, as soon as possible.",null],["Remove jewellery and clothing","Near the burn - unless stuck to the skin.",null],["Cover loosely","Cling film laid on (not wrapped tightly) or a clean plastic bag.",null],["Keep the person warm","Cool the burn, not the person - watch for shivering, especially children.",null]],"when":["Larger than their palm","Face, hands, feet, genitals or joints","Chemical or electrical burn","White, charred or painless skin","Burns in children or elderly"],"dont":["Don't use ice, butter, oil, toothpaste or creams","Don't pop blisters","Don't use fluffy cotton on the burn"]},{"id":"hypothermia","sev":"amber","title":"Hypothermia","sub":"Body too cold","recognize":"Has been out in the cold or in cold water. Shivering, pale cold skin, clumsy, slurred speech, confused or drowsy. In severe cases the shivering stops.","call":false,"metronome":false,"steps":[["Get out of the cold","Move them indoors or into shelter. Protect from wind and put something underneath to insulate them from the ground.",null],["Call 112 if it's serious","Confused, drowsy, slurred speech or no longer shivering - call 112 now.",null],["Handle gently","Move them carefully and keep them lying down if they are drowsy or very cold - rough handling can upset the heartbeat.",null],["Replace wet clothes","Take off wet clothing and put on dry layers. Cover the head and neck.",null],["Wrap them up","Blankets, a sleeping bag, coats, with a foil blanket on the outside. Body-to-body contact under the blankets helps.",null],["Warm the core of the body","Warm (not hot) packs wrapped in cloth on the chest, armpits and groin - not on the arms and legs.",null],["Warm sweet drink","Only if fully alert and able to swallow. Hot chocolate or sweet tea - no alcohol.",null],["If unresponsive","Check breathing for up to 1 minute - it can be very slow. Breathing: recovery position, keep warming. Not breathing normally: call 112 and start CPR.",null]],"when":["Confused, drowsy or slurred speech","Stopped shivering while still cold","Unresponsive","Pulled from cold water","Elderly person or baby who is very cold","Not warming up despite help"],"dont":["Don't rub or massage the arms and legs","Don't use a hot bath, a hot-water bottle directly on the skin, or a heater close to the skin","Don't give alcohol","Don't make them walk if they are very cold - move them gently"]},{"id":"frostbite","sev":"amber","title":"Frostbite","sub":"Fingers, toes, ears, nose from cold","recognize":"After time in the cold, fingers, toes, ears, nose or cheeks turn white, grey or waxy, feel hard and cold, with pins and needles and then no feeling. When they warm up they may turn red, swell and blister.","call":false,"metronome":false,"steps":[["Check for hypothermia first","Shivering hard, confused, drowsy or slurred speech? Use the ‘Hypothermia’ card first - the whole body comes before fingers and toes.",null],["Get to a warm place","Move into shelter. Remove wet clothing, and gently take off rings, watches and tight boots before swelling starts.",null],["Don't warm it if it could freeze again","Thawing and refreezing does more damage. Keep the area protected until you reach a place where it can stay warm.",null],["Rewarm in warm water","Put the area in warm water - comfortable to your elbow, about 37-39 °C, not hot - for 20-30 minutes, until the skin is soft and the colour comes back. No water? Use body heat, such as hands in the armpits. It can be very painful.",null],["Handle gently, no rubbing","Don't rub or massage the skin. Avoid walking on frostbitten feet if you can.",null],["Dry and cover loosely","Pat dry, cover with a loose, clean dressing and put gauze or cloth between fingers and toes. Keep the limb raised. Paracetamol or ibuprofen can help with pain.",null],["Get medical help","See a doctor for anything more than skin that recovers fully in a few minutes - especially if it stays white, hard or numb, or blisters appear.",null]],"when":["Signs of hypothermia - confused, drowsy, slurred speech","Skin stays white, grey, blue or black, or stays hard after warming","Blisters, especially filled with blood","Large areas affected, or the face"],"dont":["Don't rub with snow or your hands","Don't use a fire, heater, hairdryer or hot-water bottle to warm it","Don't burst blisters","Don't warm it if it might freeze again","Don't give alcohol or let them smoke"]},{"id":"head","sev":"amber","title":"Head injury","sub":"Blow to the head, concussion","recognize":"Blow to the head from a fall, hit or accident. Bump, cut, headache, dizziness, confusion or a short blackout.","call":false,"metronome":false,"steps":[["Keep them still","If there could be a neck injury (fall from height, car, diving), hold the head still in line with the body and don't move them.",null],["Unresponsive?","Call 112. Breathing: keep the airway open; only roll them if they vomit. Not breathing: CPR.",null],["Stop bleeding","Scalp wounds bleed a lot. Press with a clean cloth. If you feel a dent in the skull, press around it, not on it.",null],["Cold pack on the bump","Wrapped in a cloth, 10-20 minutes.",null],["Watch them for 24 hours","Don't leave them alone. Check they wake easily and answer normally. Look for the danger signs below.",null]],"when":["Knocked out, even briefly","Confused, very drowsy or hard to wake","Vomiting more than once","Seizure","Blood or clear fluid from the nose or ears","Weakness, numbness, slurred speech or blurred vision","Headache getting worse","Takes blood thinners","Fall from height or car accident","Baby or young child with a big bump, or not behaving normally"],"dont":["Don't give alcohol or sleeping pills","Don't let them drive or do sport the same day","Don't move them if you suspect a neck injury"]},{"id":"eye","sev":"amber","title":"Eye injury","sub":"Chemical, speck, blow to the eye","recognize":"A chemical, dust or a small object got into the eye, or the eye was hit or cut. Pain, redness, watering, blurred vision, or the eye won't open.","call":false,"metronome":false,"steps":[["Don't rub the eye","Rubbing can scratch the eye or push dirt deeper. Wash your hands before you touch the area.",null],["Chemical? Rinse at once for 20 minutes","Start immediately - every second counts. Hold the eye open and pour clean, lukewarm running water from the inner corner outward, so it doesn't run into the other eye. Take out contact lenses if they come out easily.",null],["Then call 112","For any chemical in the eye. Keep rinsing while you wait, and keep the bottle or packaging to show the paramedics.",null],["Something stuck in the eye? Don't pull it out","Don't press on the eye. Cover it loosely with a paper cup or a clean pad, ask the person to keep both eyes as still as possible, and call 112.",null],["Dust or an eyelash? Blink and rinse","Blink a few times and rinse with clean water or saline. If you can see it on the white of the eye, lift it off gently with the corner of a clean, wet cloth. Never touch the coloured part of the eye.",null],["Blow to the eye? Cold pack, no pressure","Cold pack wrapped in a cloth, held lightly against the eye for 10-15 minutes.",null],["See a doctor","After any chemical, cut or hard blow, or if pain, redness or blurred vision don't settle soon.",null]],"when":["Any chemical in the eye - especially cement, lime, bleach or drain cleaner","Something stuck in the eye","Cut to the eye or eyelid","Sudden loss of vision, or seeing flashes or a dark curtain","Blood inside the eye, or the eye looks misshapen"],"dont":["Don't rub or press on the eye","Don't try to remove anything stuck in the eye","Don't put drops, ointment, milk or anything other than clean water in the eye","Don't touch the coloured part of the eye"]},{"id":"animalbite","sev":"amber","title":"Dog or animal bite","sub":"Dog, cat, wild animal","recognize":"A bite or deep scratch from a dog, cat or other animal - puncture wounds, torn skin or bleeding. Stray dogs, foxes, bats and other wild animals carry the highest risk of rabies.","call":false,"metronome":false,"steps":[["Get away from the animal","Move to safety. Don't try to catch the animal yourself. If it has an owner, ask whether it is vaccinated against rabies.",null],["Heavy bleeding? Press first","Press hard on the wound with a clean cloth and call 112 (see ‘Severe bleeding’).",null],["Wash the wound for 15 minutes","With soap and lots of running water, even if the bite is small. This is the most important step against rabies and infection.",null],["Disinfect and cover","Apply an antiseptic (for example iodine) and cover with a clean dressing. Don't close the wound with strips or glue.",null],["See a doctor the same day","For every bite that breaks the skin. The doctor decides about rabies and tetanus vaccines and antibiotics - rabies vaccine only works if started early.",null],["Note details about the animal","What animal, where it happened, whether it had an owner and the owner's contacts, and whether it behaved strangely. An owned animal is usually observed for 10 days.",null],["Watch for infection","Over the next days, see a doctor again if there is spreading redness, swelling, warmth, pus, red streaks or fever.",null]],"when":["Bleeding that doesn't stop with pressure","Many or deep wounds, especially in a child","Bite on the face or neck","Pale, cold, clammy skin or confusion (signs of shock)"],"dont":["Don't ignore a small bite - even small punctures can carry infection or rabies","Don't close the wound with tape, strips or glue","Don't try to catch or kill the animal","Don't wait to see a doctor - rabies vaccine must start early"]},{"id":"faint","sev":"teal","title":"Fainting","sub":"Short loss of consciousness","recognize":"Feels lightheaded, pale, sweaty, then collapses briefly.","call":false,"metronome":false,"steps":[["Lay them flat","If they feel faint, help them lie down before they fall.",null],["Raise the legs","Lift the legs about 30 cm on a bag or chair.",null],["Give them air","Loosen tight clothing, ask people to step back, open a window.",null],["Wait for recovery","Most people come round within a minute. Help them sit up slowly.",null],["If they don't wake up","Check breathing: recovery position if breathing, CPR if not. Call 112.",null]],"when":["Not awake within 1-2 minutes","Chest pain, palpitations, or fainting during exercise","Injured when falling, pregnant, or over 50"],"dont":["Don't sit them up quickly","Don't splash water or slap the face"]},{"id":"fracture","sev":"teal","title":"Broken bone","sub":"Fracture, sprain","recognize":"Pain, swelling, bruising, odd shape or angle, can't move the limb.","call":false,"metronome":false,"steps":[["Keep it still","Support the injured part in the position you found it.",null],["Stop any bleeding","If the bone is through the skin, press around it with a clean cloth - not on the bone.",null],["Immobilise","Support with padding, a sling (arm) or tie to the other leg with padding between.",null],["Cold pack","Ice wrapped in a cloth, 10-20 minutes. Never ice directly on skin.",null],["Get medical help","Hospital for an X-ray. Call 112 for major bones or if they can't be moved.",null]],"when":["Bone through the skin","Thigh, hip, pelvis, neck or back injury","Limb is cold, pale or numb below the injury"],"dont":["Don't try to straighten the bone","Don't let them eat or drink (they may need surgery)","Don't move them if you suspect neck/back injury"]},{"id":"nosebleed","sev":"teal","title":"Nosebleed","sub":"Bleeding from the nose","recognize":"Blood running from one or both nostrils.","call":false,"metronome":false,"steps":[["Sit up and lean forward","So blood runs out of the nose, not down the throat.",null],["Pinch the soft part of the nose","Just below the bony bridge. Breathe through the mouth.",null],["Hold for 10-15 minutes","Without letting go to check. Use a clock.",null],["Spit out blood","Swallowed blood can make them vomit.",null],["Still bleeding? Another 10 minutes","A cold pack on the bridge of the nose can help.",null],["After it stops","Don't blow or pick the nose, and avoid heavy effort for 24 hours.",null]],"when":["Bleeding for more than 20 minutes","After a blow to the head or face","Very heavy bleeding or trouble breathing","Takes blood thinners"],"dont":["Don't tilt the head back","Don't lie down","Don't push tissue deep into the nose"]},{"id":"cuts","sev":"teal","title":"Cuts and grazes","sub":"Small wounds, scrapes","recognize":"A small cut, scrape or graze that bleeds a little. If blood is spurting or soaking through, use the ‘Severe bleeding’ card.","call":false,"metronome":false,"steps":[["Wash your hands","Use gloves if you have them.",null],["Stop the bleeding","Press on the wound with a clean cloth or gauze for 5-10 minutes. Raise it if it's on an arm or leg.",null],["Clean the wound","Rinse under clean running tap water. Gently wash out dirt and gravel - especially from a graze, so it doesn't get infected.",null],["Dry and cover","Pat the skin around it dry. You can use an antiseptic, then cover with a plaster or a non-stick dressing.",null],["Change the dressing","Every day, or sooner if it gets wet or dirty. Keep the wound clean and dry.",null],["Does it need stitches?","See a doctor within a few hours if the edges gape open, it's deep or longer than about 2 cm, or it's on the face, a joint or the hand.",null],["Tetanus","Dirty wound (soil, rust, animal) and no tetanus shot in the last 5 years, or not sure? See a doctor about a booster.",null],["Watch for infection","See a doctor if redness spreads, it swells, feels hot, has pus or red streaks, or there is fever.",null]],"when":["Bleeding doesn't stop after 10 minutes of firm pressure","Blood is spurting","Something is stuck deep in the wound"],"dont":["Don't put cotton wool directly on the wound - the fibres stick","Don't pour alcohol or hydrogen peroxide into the wound","Don't pull out an object stuck deep in the wound - press around it","Don't blow on the wound"]},{"id":"tick","sev":"teal","title":"Tick bite","sub":"Tick stuck in the skin","recognize":"A small dark bug stuck firmly in the skin, often in the armpits, groin, behind the knees or ears, at the waistline, or on a child's scalp.","call":false,"metronome":false,"steps":[["Remove it as soon as possible","The longer a tick stays attached, the higher the risk of infection.",null],["Grip it close to the skin","Use fine-pointed tweezers or a tick remover. Grab the tick by the head, as close to the skin as you can - not by the body.",null],["Pull straight out, slowly and steadily","Don't twist or jerk. If you use a tick hook or card, follow its instructions.",null],["Part left in the skin?","Try to remove it with the tweezers. If you can't easily, leave it - the skin will push it out as it heals.",null],["Clean the bite and your hands","Soap and water or an antiseptic.",null],["Note the date","Write down the date and where on the body the bite was. Check the whole body for more ticks, including children and pets.",null],["Watch the bite for 30 days","See a doctor if a red rash grows around the bite (often a ring or ‘bull's-eye’), a dark spot forms at the bite, or there is fever, headache, muscle aches or tiredness.",null]],"when":["High fever with bleeding from the gums or nose, or unusual bruising","Severe headache, stiff neck or confusion","Swelling of the face or trouble breathing"],"dont":["Don't squeeze or crush the tick's body","Don't put oil, butter, alcohol or nail polish on the tick, and don't burn it","Don't dig deep into the skin for leftover parts"]},{"id":"tape","sev":"teal","title":"Kinesio taping","sub":"Sprain or strain: ankle, knee, wrist, shoulder, back","recognize":"For a mild sprain (twisted joint) or strain (pulled muscle) after the first check. The tape can give comfort and a feeling of support, but it doesn't heal the injury - evidence that it speeds recovery is limited.","call":false,"metronome":false,"steps":[["First: sprain, not a break?","See a doctor before taping if you can't put weight on it or take 4 steps, the bone itself hurts when you press it, the joint looks deformed, or there is a lot of swelling or bruising.",null],["First 48 hours: rest, cold, support, raise","Rest the joint. Cold pack wrapped in a cloth for 10-20 minutes every 2-3 hours. Elastic bandage for support. Keep it raised.",null],["Prepare the skin and the tape","Skin clean, dry and without cream; trim thick hair. Measure the strips on the stretched joint, cut them and round off the corners with scissors so they don't peel. Apply 30-60 minutes before sport or a shower.",null],["The basic rule: ends without stretch","Stick the first 3-5 cm (the anchor) with no stretch. Stretch only the middle part. Stick the last 3-5 cm again with no stretch. Never wrap the tape all the way around an arm or leg. Rub it firmly for a few seconds - warmth activates the glue.",null],["Ankle","For the common outer sprain (foot rolled inward). Foot at a right angle. Strip 1 (goes on first): a short strip of about 10 cm, centred on the sore spot just in front of and below the outer ankle bone, with half to three-quarters stretch in the middle. Strip 2 (stirrup): from the inner side of the lower leg, about a hand above the ankle bone, down under the heel and up the outer side, with about half stretch over the outer ankle bone. Strip 3 (heel lock): from the front of the ankle, diagonally down behind the heel and under it, then back up to the front, with light stretch. Do the same from the other side, so the two strips cross behind the heel.","tape_ankle"],["Knee","Sit with the knee bent. Cut a strip about 30 cm long down the middle, leaving 5 cm uncut (a Y). Stick the uncut end on the front of the thigh about a hand above the kneecap. Run the two tails around each side of the kneecap with light stretch and stick the ends below it. Optional: a short strip across just below the kneecap, half stretch in the middle. Pain on the inner or outer side of the knee? First put two short strips in an X over the painful side, crossing at the level of the joint, with half stretch in the middle - then the Y on top.","tape_knee"],["Wrist","Bend the wrist down, palm toward the floor. Strip 1: from the back of the hand, just below the knuckles, along the back of the forearm for about 15 cm, light stretch. Strip 2: across the back of the wrist, half stretch in the middle, ends on the sides - not meeting on the palm side.","tape_wrist"],["Shoulder","Sit with the arm hanging. Cut a Y-strip about 25 cm long. Stick the uncut end on the outer upper arm, about a third of the way down. Move the arm back and lay the front tail over the front of the shoulder to the top. Move the arm forward across the chest and lay the back tail over the back of the shoulder to the top. Light stretch on both tails.","tape_shoulder"],["Lower back","Bend forward as far as is comfortable. Stick two strips of about 25 cm, one on each side of the spine (on the muscles, not the bone), from just above the buttocks upward, with light stretch. Optional: a short strip across the most painful spot, half stretch in the middle.","tape_back"],["Wearing and removing","Tape can stay on 3-5 days, and you can shower - pat it dry. Remove it slowly in the direction of hair growth, pressing the skin down next to it; soaking it with oil first helps. Take it off at once if the skin itches, burns or tingles, or the pain gets worse.",null]],"when":["Bone through the skin, or the joint looks deformed","Arm or leg below the injury is cold, pale or numb"],"dont":["Don't tape over wounds, broken or irritated skin, or a suspected fracture","Don't wrap the tape all the way around a limb","Don't stretch the ends of the strips","Don't use it if you are allergic to plasters or adhesive","Don't use tape instead of a doctor for a bad injury"]}],"bg":[{"id":"cpr","sev":"red","title":"Не диша (възрастен)","sub":"Не реагира, не диша нормално","recognize":"Не реагира, когато го викате и го потупвате по раменете, и не диша нормално (редките хрипливи вдишвания не се броят).","call":true,"metronome":true,"steps":[["Уверете се, че е безопасно","Проверете за коли, ток, огън или газ, преди да приближите.",null],["Проверете дали реагира","Потупайте го здраво по раменете и извикайте: „Добре ли сте?“",null],["Отворете дихателните пътища, проверете дишането","Наклонете главата назад, повдигнете брадичката. Гледайте, слушайте и усетете за нормално дишане до 10 секунди.",null],["Обадете се на 112 на високоговорител","Останете с човека. Изпратете някого да донесе AED (автоматичен дефибрилатор), ако има наблизо.",null],["Натискайте силно и бързо","Основата на дланта в центъра на гръдния кош, другата ръка отгоре, ръцете изпънати. Натискайте 5-6 см дълбоко, 100-120 пъти в минута. Оставяйте гърдите да се изправят напълно между натисканията.","cpr_adult"],["30 натискания, после 2 вдишвания","Ако сте обучени: наклонете главата, запушете носа, 2 вдишвания по 1 секунда. Ако не сте обучени или не желаете: просто продължете да натискате без прекъсване.",null],["Използвайте AED веднага щом пристигне","Включете го и следвайте гласовите указания. Продължавайте да натискате, докато се поставят електродите.",null],["Не спирайте","Продължете, докато екипът поеме, човекът задиша нормално или физически не можете повече. Сменяйте се с друг човек на всеки 2 минути, ако е възможно.",null]],"when":["Винаги - обадете се на 112 веднага"],"dont":["Не спирайте натисканията, за да търсите пулс","Не се страхувайте, че ще го нараните - счупените ребра зарастват, сърдечният арест - не"]},{"id":"choking","sev":"red","title":"Задавяне (възрастен)","sub":"Възрастен или тийнейджър","recognize":"Внезапно не може да говори, да кашля или да диша; често се хваща за гърлото.","call":false,"metronome":false,"steps":[["Попитайте „Задавихте ли се?“","Ако може да кашля силно, насърчете го да продължи да кашля и останете до него.",null],["До 5 удара по гърба","Застанете отстрани, наведете го напред, подпирайте гърдите му. Удряйте силно между лопатките с основата на дланта. Проверявайте след всеки удар.","back_blows"],["До 5 коремни тласъка","Застанете отзад, юмрук точно над пъпа, другата ръка върху него. Дърпайте рязко навътре и нагоре. Проверявайте след всеки тласък.","abdominal"],["Повтаряйте","Редувайте 5 удара по гърба и 5 тласъка, докато предметът излезе.",null],["Обадете се на 112, ако не излиза","Продължавайте, докато някой друг се обажда.",null],["Ако спре да реагира","Положете го на земята, обадете се на 112 и започнете КПР (вижте „Не диша“).",null]],"when":["Предметът не излиза след 3 цикъла","Спре да реагира","След всякакви коремни тласъци - нужен е лекарски преглед"],"dont":["Не бъркайте с пръсти в устата на сляпо","Не удряйте по гърба човек, който кашля ефективно"]},{"id":"drowning","sev":"red","title":"Удавяне","sub":"Изваден от водата","recognize":"Човек, изваден от водата, който не реагира, не диша нормално или кашля и диша трудно.","call":true,"metronome":true,"steps":[["Не ставайте втора жертва","Подайте прът или хвърлете нещо, което плава. Влизайте във водата само ако сте обучени и е безопасно.",null],["Изведете го и се обадете на 112","Дръжте го легнал по гръб. Включете високоговорителя.",null],["Отворете дихателните пътища, проверете дишането","Наклонете главата назад, повдигнете брадичката. Гледайте, слушайте и усетете до 10 секунди.",null],["Не диша? Първо 5 вдишвания","Запушете носа, 5 вдишвания по 1 секунда. Удавянето е проблем с дишането, затова вдишванията са по-важни, отколкото при други колапси.",null],["После КПР: 30 натискания, 2 вдишвания","Център на гръдния кош, 5-6 см дълбоко, 100-120 в минута. За дете или бебе използвайте картата за дете или бебе.","cpr_adult"],["Ако повърне","Обърнете го на една страна, оставете да се оттече, почистете устата и продължете.",null],["Диша? Възстановително положение, пазете го топъл","Свалете мокрите дрехи, ако можете, и го завийте. Продължавайте да проверявате дишането.","recovery"]],"when":["Винаги - дори ако изглежда добре; проблеми с дишането могат да се появят часове по-късно"],"dont":["Не се опитвайте да изкарвате вода от белите дробове - без коремни тласъци, без обръщане с главата надолу","Не плувайте навътре, ако не сте обучени"]},{"id":"bleeding","sev":"red","title":"Силно кървене","sub":"Кръвта шурти или попива през дрехите","recognize":"Кръвта пулсира или тече бързо, или попива през дрехите.","call":true,"metronome":false,"steps":[["Защитете се","Използвайте ръкавици или найлонова торбичка върху ръката, ако имате.",null],["Притиснете силно раната","С чиста кърпа, бинт или с ръката си. Натискайте здраво и не пускайте.",null],["Обадете се на 112","Или накарайте някой друг да се обади, докато вие натискате.",null],["Натискайте поне 10 минути","Ако кръвта попие, добавете още плат отгоре - не махайте първия слой.",null],["Превържете стегнато","Когато кървенето намалее, превържете стегнато върху тампона. Проверете дали пръстите остават топли и розови.",null],["Турникет при кървене от крайник, което не спира","Само за ръце и крака: 5-7 см над раната, затягайте, докато кървенето спре, запишете часа.",null],["Положете го легнал, пазете го топъл","Следете за бледа, студена, лепкава кожа и объркване - признаци на шок.",null]],"when":["Кървенето не спира при натиск","Кръвта шурти","Дълбока рана или забит предмет в нея"],"dont":["Не вадете забит в раната предмет - натискайте около него","Не повдигайте тампона, за да проверите"]},{"id":"amputation","sev":"red","title":"Отрязан пръст или крайник","sub":"Отрязан или откъснат","recognize":"Пръст на ръката или крака, китка или част от ръка или крак е отрязан или откъснат - от трион, машина, врата, градински инструмент или при злополука. Може да има силно кървене.","call":true,"metronome":false,"steps":[["Осигурете безопасност","Изключете машината или тока. Сложете ръкавици или найлонова торбичка на ръката си, ако можете.",null],["Обадете се на 112","Кажете, че има отрязана част от тялото.",null],["Спрете кървенето","Притиснете силно раната с чиста кърпа и я повдигнете. Силно кървене от ръка или крак, което не спира с натиск: турникет 5-7 см над раната, запишете часа (вижте „Силно кървене“).",null],["Положете го легнал, пазете го топъл","Следете за бледа, студена, лепкава кожа и объркване - признаци на шок.",null],["Намерете отрязаната част","Не я мийте и не я търкайте. Ако е много замърсена, изплакнете я за кратко с чиста вода.",null],["Увийте я и я затворете в торбичка","Увийте частта в чиста, леко влажна марля или кърпа. Сложете я в чиста найлонова торбичка и я затворете плътно.",null],["Дръжте я студена, но не върху лед","Сложете затворената торбичка във втора торбичка или съд с лед и малко вода. Частта никога не трябва да докосва директно лед или вода - замръзнала или накисната тъкан не може да се присади. Напишете името и часа върху торбичката.",null],["Изпратете я с пострадалия","Дайте я на екипа. Присаждането е най-успешно, когато частта пристигне студена и възможно най-рано.",null],["Частично отрязан?","Ако частта още виси на кожа, не я отрязвайте. Върнете я в нормалното ѝ положение, покрийте с влажна превръзка и я подпрете.",null]],"when":["Винаги - при всяка отрязана или откъсната част от тялото"],"dont":["Не слагайте частта директно върху лед или във вода и никога не я замразявайте","Не мийте и не търкайте частта","Не отрязвайте част, която още виси","Не давайте храна или напитки - вероятно ще е нужна операция"]},{"id":"allergy","sev":"red","title":"Тежка алергична реакция","sub":"Анафилаксия","recognize":"Бързо подуване на устните, езика или гърлото, затруднено дишане, свирене в гърдите, обрив, замайване - често след храна, ужилване или лекарство.","call":true,"metronome":false,"steps":[["Използвайте неговата адреналинова писалка","Във външната страна на бедрото, може и през дрехите. Следвайте указанията на писалката.",null],["Обадете се на 112","Кажете „анафилаксия“.",null],["Положение","Положете го легнал с повдигнати крака. Ако му е трудно да диша, оставете го да седне. Не го карайте да става или да ходи.",null],["Втора доза след 5 минути","Ако няма подобрение и има втора писалка.",null],["Следете дишането","Ако спре да реагира и не диша нормално, започнете КПР.",null]],"when":["Винаги, дори ако инжекцията помогне - симптомите могат да се върнат"],"dont":["Не чакайте да видите дали ще се влоши","Не го карайте да се изправя рязко"]},{"id":"electric","sev":"red","title":"Токов удар","sub":"Електричество, мълния","recognize":"Човек, намерен до кабел, контакт или уред, или след мълния; може да не реагира, да е изгорен или объркан.","call":true,"metronome":false,"steps":[["Не го докосвайте още","Докато е в контакт с тока, токът може да премине и през вас.",null],["Изключете тока","Извадете щепсела на уреда или изключете от таблото с бушоните.",null],["Не може да се изключи? Отделете го с нещо сухо","Застанете върху сухо дърво, гума или дебела книга. Със суха дървена дръжка на метла или стол отместете кабела или човека. Само при домашно електричество.",null],["Далекопроводи: стойте далеч","Стойте на поне 18 метра и се обадете на 112. Не приближавайте, докато енергийното дружество не потвърди, че токът е спрян.",null],["Обадете се на 112","Всеки сериозен токов удар изисква преглед в болница, дори ако човекът изглежда добре.",null],["Проверете дишането","Не диша: започнете КПР и използвайте AED. Диша: възстановително положение.",null],["Охладете изгарянията","Охлаждайте входните и изходните изгаряния под течаща вода 20 минути, после покрийте свободно.",null]],"when":["Високо напрежение или мълния","Каквато и да е загуба на съзнание","Изгаряния","Болка в гърдите, неравномерен пулс, объркване","Бременност"],"dont":["Не докосвайте човека, докато токът не е спрян","Не използвайте нищо мокро или метално","Не приближавайте паднали жици"]},{"id":"accident","sev":"red","title":"Катастрофа","sub":"Кола, мотор, блъснат пешеходец","recognize":"Катастрофа с кола, мотор, велосипед или пешеходец. Може да има ранени, затиснати, в безсъзнание или кървящи хора, а също движение, изтекло гориво или огън.","call":true,"metronome":false,"steps":[["Първо осигурете своята безопасност","Спрете на безопасно разстояние от катастрофата, пуснете аварийните светлини и облечете светлоотразителна жилетка. Поставете авариен триъгълник далеч зад мястото - поне 30 м, по-далеч на бързи пътища. Внимавайте за движението.",null],["Обадете се на 112","Кажете точно къде сте (път, посока, километър или ориентир), колко коли и колко ранени има, и дали някой е затиснат, има ли огън или изтичащо гориво.",null],["Обезопасете колите","Изключете двигателите, ако можете. Без пушене. Ако има огън или силна миризма на гориво, дръжте всички настрана.",null],["Не местете ранените","Освен ако са в непосредствена опасност - огън или движение. Приемете, че има травма на врата или гърба: помолете ги да не мърдат и задръжте главата на една линия с тялото.",null],["Първо помогнете на най-тежките","Не диша: започнете КПР (вижте „Не диша“). Силно кървене: притиснете силно раната. В безсъзнание, но диша, на седалката: подпрете главата и поддържайте дихателните пътища отворени - местете го само ако дишането е застрашено.",null],["Мотоциклетист: не сваляйте каската","Свалете я само ако не диша и не можете да отворите дихателните пътища по друг начин - най-добре с двама души, като пазите главата и врата на една линия.",null],["Пазете ги топли и останете с тях","Завийте ги с палто или одеяло, говорете им спокойно и следете дишането им до пристигането на помощ.",null]],"when":["Винаги - всеки ранен, затиснат или в безсъзнание се нуждае от линейка"],"dont":["Не местете ранените, освен при непосредствена опасност","Не сваляйте каската на мотоциклетист, освен ако е нужно, за да може да диша","Не давайте храна или напитки","Не стойте и не тичайте по платното за движение"]},{"id":"spine","sev":"red","title":"Травма на врата или гърба","sub":"Гръбначен стълб: падане, скок във вода, катастрофа","recognize":"След падане от височина, скок в плитка вода, катастрофа с кола или мотор, или силен удар по главата или гърба. Болка във врата или гърба, изтръпване, мравучкане или слабост в ръцете или краката - или безсъзнание след такъв инцидент.","call":true,"metronome":false,"steps":[["Уверете се, че е безопасно","Внимавайте за движение, вода, падащи предмети. Местете човека само ако е в непосредствена опасност.",null],["Обадете се на 112","Кажете, че подозирате травма на врата или гърба и как е станало.",null],["Кажете му да не мърда","„Не мърдайте главата, помощта идва.“ Успокойте го - много хора инстинктивно се опитват да седнат.",null],["Задръжте главата неподвижна","Коленичете до главата му. Поставете ръцете си от двете страни на главата, върху ушите, и я дръжте на една линия с тялото - не дърпайте. Дръжте, докато екипът поеме. Ако ви трябват ръцете, поставете навити дрехи или кърпи от двете страни на главата.",null],["Оставете го както сте го намерили","Не го изправяйте. Ако трябва да го преместите заради опасност, пазете главата, врата и тялото на една права линия - най-добре няколко души да го обърнат заедно.",null],["Не реагира? Дишането е на първо място","Отворете дихателните пътища, като внимателно повдигнете брадичката и местите главата възможно най-малко. Не диша: започнете КПР. Ако повърне, обърнете го на една страна, като пазите главата, врата и тялото на една линия.",null],["Инцидент при скок във вода","Дръжте лицето над водата и подпирайте главата и гърба на една права линия. С помощ го изведете до брега или ръба, като пазите тялото изправено. Не диша: изведете го и вижте „Удавяне“.",null],["Пазете го топъл и наблюдавайте","Завийте го с палто или одеяло и проверявайте дишането, докато пристигне помощ.",null]],"when":["Винаги - при всяко съмнение за травма на врата или гърба","Изтръпване, мравучкане или слабост в ръцете или краката","Безсъзнание след падане, скок във вода или катастрофа"],"dont":["Не го местете, освен ако е в опасност","Не му позволявайте да сяда, да става или да ходи „за проба“","Не извивайте и не навеждайте врата и не слагайте възглавница под главата","Не сваляйте каската на мотоциклетист, освен ако е нужно, за да може да диша","Не давайте храна или напитки"]},{"id":"unconscious","sev":"red","title":"В безсъзнание, но диша","sub":"Възстановително положение","recognize":"Не реагира, но диша нормално.","call":true,"metronome":false,"steps":[["Проверете дишането","Наклонете главата назад, повдигнете брадичката и потвърдете нормално дишане до 10 секунди.",null],["Обадете се на 112","Включете високоговорителя, за да са ви свободни ръцете.",null],["Обърнете го на една страна","Ръката по-близо до вас - под прав ъгъл. Другата му ръка - до бузата. Свийте далечния крак в коляното и го дръпнете към себе си, за да се обърне на една страна.","recovery"],["Поддържайте дихателните пътища отворени","Наклонете леко главата назад, така че устата да сочи надолу и течностите да се оттичат.",null],["Проверявайте дишането","Проверявайте всяка минута. Ако спре да диша, обърнете го по гръб и започнете КПР (вижте „Не диша“).",null],["Пазете го топъл","Завийте го с палто или одеяло до пристигането на помощ.",null]],"when":["Винаги - всеки в безсъзнание се нуждае от линейка"],"dont":["Не давайте храна или напитки","Не го оставяйте сам","Не го местете, ако подозирате травма на врата или гръбначния стълб - обръщайте го само ако дишането е застрашено"]},{"id":"shock","sev":"red","title":"Шок","sub":"Блед, студен, лепкав след нараняване","recognize":"Бледа, студена, лепкава кожа; ускорен слаб пулс; учестено повърхностно дишане; замаян, слаб, жаден, неспокоен или объркан - обикновено след силно кървене, тежка травма, изгаряния, силно повръщане или диария, или алергична реакция.","call":true,"metronome":false,"steps":[["Обадете се на 112","Шокът може да се влоши бързо, дори ако в началото човекът изглежда добре.",null],["Овладейте причината","Спрете кървенето със силен натиск върху раната (вижте „Силно кървене“). При тежка алергична реакция използвайте адреналиновата му писалка (вижте „Тежка алергична реакция“).",null],["Положете го легнал","По гръб, върху одеяло или палто, ако е възможно.",null],["Повдигнете краката","Повдигнете леко краката, ако няма травма на краката, таза, врата или гърба и това не причинява болка. Не го правете, ако дишането се затруднява.",null],["Пазете го топъл","Завийте го с палто или одеяло. Разхлабете стегнатите дрехи на врата, гърдите и кръста.",null],["Успокойте го и наблюдавайте","Останете до него, успокойте го и проверявайте редовно дишането и дали реагира.",null],["Ако не реагира","Диша: възстановително положение. Не диша нормално: започнете КПР (вижте „Не диша“).",null]],"when":["Винаги - шокът е спешно състояние"],"dont":["Не давайте храна или напитки - може да е нужна операция; ако е жаден, намокрете устните му","Не го оставяйте да става и да ходи","Не го оставяйте сам","Не използвайте грейка или печка - само го пазете от загуба на топлина"]},{"id":"heart","sev":"red","title":"Инфаркт","sub":"Болка или натиск в гърдите","recognize":"Болка, натиск или стягане в гърдите, което може да се разпространява към ръката, челюстта, врата или гърба. Изпотяване, гадене, задух.","call":true,"metronome":false,"steps":[["Обадете се на 112","Кажете, че подозирате инфаркт.",null],["Настанете го полуседнал","С подгънати колене, облегнат на нещо. Разхлабете стегнатите дрехи.",null],["Аспирин","Ако не е алергичен и лекар не му го е забранил: един аспирин за възрастни (150-300 mg), сдъвкан бавно.",null],["Неговото лекарство","Ако носи нитроглицерин (спрей или таблетки), помогнете му да го вземе.",null],["Останете и наблюдавайте","Успокойте го. Ако спре да реагира и не диша нормално, започнете КПР (вижте „Не диша“).",null]],"when":["Винаги - не чакайте да мине от само себе си"],"dont":["Не го оставяйте да ходи пеша или да шофира до болницата","Не давайте аспирин на деца"]},{"id":"stroke","sev":"red","title":"Инсулт","sub":"Проблем с лицето, ръката или говора","recognize":"Увиснала едната страна на лицето, слабост в ръката (не може да вдигне и двете), завален или объркан говор.","call":true,"metronome":false,"steps":[["Проверете лице, ръце, говор","Помолете го да се усмихне, да вдигне двете ръце и да повтори просто изречение.",null],["Обадете се на 112 веднага","Кажете „инсул
