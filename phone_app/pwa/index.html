т“ - всяка минута е важна.",null],["Запишете часа","Запомнете кога са започнали симптомите или кога за последно е бил добре. Лекарите се нуждаят от това.",null],["Настанете го удобно","Седнал или легнал, с леко повдигнати глава и рамене. Успокойте го.",null],["Ако не реагира","Поставете го във възстановително положение, ако диша; започнете КПР, ако не диша.",null]],"when":["Който и да е от тези признаци - дори ако отмине"],"dont":["Не давайте храна, напитки или лекарства","Не чакайте симптомите да се подобрят"]},{"id":"birth","sev":"red","title":"Спешно раждане","sub":"Бебето идва преди помощта","recognize":"Силни контракции на всеки 2-3 минути или по-често, напъни, изтекли води или се вижда главичката на бебето. Може да няма време да се стигне до болница.","call":true,"metronome":false,"steps":[["Обадете се на 112","Кажете, че бебето идва. Включете високоговорителя - операторът ще ви води стъпка по стъпка.",null],["Пригответе се","Измийте ръцете си, сложете ръкавици, ако имате. Пригответе чисти кърпи или чаршафи и одеяло за бебето. Затоплете стаята.",null],["Помогнете на майката да се настани","Полуседнала, подпряна с възглавници, или легнала на една страна - както ѝ е най-удобно. Чист чаршаф или кърпа под таза.",null],["Подпрете главичката, не дърпайте","Когато главичката излиза, подпрете я леко с длан и я оставете да излезе бавно. Помолете майката да диша на кратки пресекулки, вместо да напъва силно. Ако пъпната връв е около врата и е хлабава, внимателно я прехвърлете през главичката.",null],["Поемете тялото","Раменете и тялото обикновено излизат със следващата контракция. Подпрете бебето - то е хлъзгаво. Никога не дърпайте бебето или пъпната връв.",null],["Подсушете и стоплете бебето","Сложете бебето кожа до кожа на гърдите на майката, подсушете го добре с кърпа и завийте и двамата, включително главичката на бебето. Почистете устата и носа, ако е нужно.",null],["Проверете дали бебето диша","Бебето трябва да проплаче или да задиша до около 1 минута. Ако не - разтрийте силно гърба и стъпалата. Пак не диша: започнете КПР на бебе (вижте „Не диша (бебе)“).",null],["Оставете пъпната връв и плацентата","Не режете пъпната връв. Плацентата обикновено излиза до 30 минути - не я дърпайте; запазете я в купа или торбичка за екипа. Запишете часа на раждането.",null],["Силно кървене след раждането?","Малко кървене е нормално. Ако е силно, масажирайте силно долната част на корема точно под пъпа, където матката се напипва като твърда топка, и сложете бебето да суче - и двете помагат на матката да се свие.",null]],"when":["Винаги - обадете се на 112 веднага щом раждането изглежда близо","Бебето не диша, отпуснато е или е посиняло след 1 минута","Силно кървене при майката, кърпите се напояват","Първо излиза крачето, дупето или пъпната връв","Преждевременно раждане или майката получи гърч"],"dont":["Не дърпайте бебето или пъпната връв","Не режете пъпната връв","Не се опитвайте да задържите бебето или да забавите раждането","Не издърпвайте плацентата","Не къпете бебето - пазете го топло и сухо"]},{"id":"heatstroke","sev":"red","title":"Топлинен удар","sub":"Прегряване, слънчев удар","recognize":"Много горещо тяло след жега или усилие, объркан или държи се странно, главоболие, замайване, може да припадне. Кожата може да е суха или потна.","call":true,"metronome":false,"steps":[["Обадете се на 112","Объркване в жегата е спешен случай.",null],["Преместете го на хладно","На сянка, в климатизирана стая, далеч от слънцето.",null],["Свалете излишните дрехи","До леко бельо.",null],["Охладете бързо","Най-добре: потопете тялото в студена вода до врата. Иначе го намокрете обилно със студена вода, веете му силно и поставете студени компреси на врата, подмишниците и слабините.",null],["Глътки хладна вода","Само ако е напълно в съзнание и може да преглъща.",null],["Ако не реагира","Възстановително положение, ако диша, КПР, ако не диша. Продължете да охлаждате.",null]],"when":["Объркан, сънлив или припаднал","Гърч","Няма подобрение след 15 минути охлаждане"],"dont":["Не давайте напитки, ако е объркан или повръща","Не давайте парацетамол или аспирин - не свалят температурата при топлинен удар","Не спирайте охлаждането, ако започне да трепери"]},{"id":"poisoning","sev":"red","title":"Отравяне","sub":"Погълнато, вдишано, по кожата","recognize":"Погълнати лекарства, химикали, растения или гъби; вдишан газ или пари; или химикали по кожата или в очите. Може да е сънлив, да повръща, да е объркан или да изпитва болка.","call":true,"metronome":false,"steps":[["Защитете се","Газ или пари: отворете прозорците, изведете го на чист въздух, не влизайте, ако не е безопасно. Ползвайте ръкавици при химикали.",null],["Обадете се на 112","Кажете какво е погълнато, колко и кога. Запазете опаковката, бутилката или растението, за да ги покажете на екипа.",null],["Химикали по кожата","Свалете напоените дрехи. Изплаквайте кожата с много течаща вода поне 20 минути.",null],["Химикали в окото","Изплаквайте с течаща вода 15-20 минути, като държите окото отворено.",null],["Погълнато нещо разяждащо","Нека изплакне устата с вода и да я изплюе.",null],["Ако не реагира","Възстановително положение, ако диша. Не диша: КПР - само с натискания, ако има отрова по устните.",null]],"when":["Винаги при отравяне - операторът ще ви посъветва"],"dont":["Не предизвиквайте повръщане","Не давайте мляко, солена вода или каквото и да е за пиене, освен ако не ви кажат","Не давайте активен въглен, освен по указание на лекар"]},{"id":"cpr-child","sev":"kids","title":"Не диша (дете)","sub":"От 1 година до пубертета","recognize":"Детето не реагира, когато му говорите високо и го потупвате, и не диша нормално.","call":true,"metronome":true,"steps":[["Уверете се, че е безопасно","Проверете за коли, вода, ток, преди да приближите.",null],["Проверете дали реагира","Потупайте детето и кажете високо: „Добре ли си?“",null],["Обадете се на 112 на високоговорител","Викайте за помощ. Ако имате телефон, обадете се на 112 сега и включете високоговорителя. Нямате телефон? Направете 1 минута КПР, после идете да се обадите.",null],["Отворете дихателните пътища, проверете дишането","Наклонете внимателно главата назад и повдигнете брадичката. Гледайте, слушайте и усетете за нормално дишане до 10 секунди.",null],["Дайте 5 вдишвания","Запушете носа, обхванете устата му с вашата, издишайте равномерно около 1 секунда - колкото гърдите да се повдигнат.",null],["Направете 15 натискания на гръдния кош","Основата на едната длан (или двете ръце при по-голямо дете) на долната половина на гръдната кост. Натискайте около 5 см - една трета от дълбочината на гърдите - 100-120 пъти в минута.","cpr_child"],["Продължете: 2 вдишвания, 15 натискания","Повтаряйте без дълги паузи. Ако не можете или не желаете да давате вдишвания, продължете само с натискания - това е много по-добре от нищо.",null],["Използвайте AED веднага щом пристигне","Включете го и следвайте гласа. Използвайте детски електроди или детски режим, ако има; иначе електродите за възрастни също стават.",null]],"when":["Винаги - обадете се на 112 веднага"],"dont":["Не пропускайте първите 5 вдишвания, ако можете да ги дадете - децата обикновено спират да дишат, преди да спре сърцето","Не спирайте, за да търсите пулс"]},{"id":"cpr-infant","sev":"kids","title":"Не диша (бебе)","sub":"Под 1 година","recognize":"Бебето е отпуснато, не реагира на допир или глас и не диша нормално.","call":true,"metronome":true,"steps":[["Проверете дали реагира","Говорете високо и леко потупайте стъпалото. Не разтърсвайте бебето.",null],["Обадете се на 112 на високоговорител","Викайте за помощ. Ако имате телефон, обадете се на 112 сега и включете високоговорителя. Нямате телефон? Направете 1 минута КПР, после се обадете - носете бебето със себе си, ако можете.",null],["Отворете дихателните пътища - главата права","Положете бебето по гръб на твърда повърхност. Дръжте главата в неутрално положение (носът сочи нагоре), не наклонена назад. Повдигнете брадичката с един пръст.",null],["Проверете дишането","Гледайте, слушайте и усетете за нормално дишане до 10 секунди.",null],["Дайте 5 вдишвания","Обхванете с устата си едновременно устата И носа на бебето. Давайте леки вдишвания от около 1 секунда - колкото гърдите да се повдигнат.",null],["Направете 15 натискания на гръдния кош","Два пръста на долната половина на гръдната кост (точно под линията на зърната). Натискайте около 4 см - една трета от дълбочината на гърдите - 100-120 пъти в минута.","cpr_infant"],["Продължете: 2 вдишвания, 15 натискания","Повтаряйте. Ако не можете да давате вдишвания, продължете само с натискания.",null],["Използвайте AED, ако пристигне","Следвайте гласа. Използвайте детски електроди или детски режим, ако има - един електрод отпред на гърдите и един на гърба, ако не се побират отпред.",null]],"when":["Винаги - обадете се на 112 веднага"],"dont":["Не накланяйте главата силно назад - дихателните пътища на бебето са меки и могат да се затворят","Не разтърсвайте бебето","Не издишвайте силно - леки вдишвания с въздуха от бузите са достатъчни"]},{"id":"choking-child","sev":"kids","title":"Задавяне (дете)","sub":"От 1 година до пубертета","recognize":"Детето внезапно не може да говори, да плаче, да кашля или да диша; може да почервенее или посинее, да се хваща за гърлото.","call":false,"metronome":false,"steps":[["Силна ли е кашлицата?","Ако детето може да кашля силно, насърчете го да кашля и стойте до него. Не го удряйте по гърба.",null],["Викайте за помощ, обадете се на 112 на високоговорител","Пазете ръцете си свободни за детето.",null],["До 5 удара по гърба","Коленичете или застанете зад или до детето, наведете го напред. Силни удари между лопатките с основата на дланта. Проверявайте след всеки удар.","back_blows"],["До 5 коремни тласъка","Коленичете или застанете отзад. Юмрук точно над пъпа, другата ръка върху него. Дърпайте рязко навътре и нагоре. Проверявайте след всеки тласък.","abdominal"],["Повтаряйте","Редувайте 5 удара по гърба и 5 тласъка, докато предметът излезе или детето спре да реагира.",null],["Ако детето спре да реагира","Положете го и започнете КПР - вижте „Не диша (дете)“, като започнете с 5 вдишвания.",null]],"when":["Предметът не излиза бързо","Детето спре да реагира","След всякакви коремни тласъци - детето се нуждае от лекарски преглед"],"dont":["Не бъркайте с пръсти на сляпо - може да избутате предмета по-навътре; махайте го само ако ясно го виждате","Не дръжте детето с главата надолу за краката"]},{"id":"choking-infant","sev":"kids","title":"Задавяне (бебе)","sub":"Под 1 година","recognize":"Бебето внезапно не може да плаче, да кашля или да диша; тихо е, мъчи се, посинява.","call":false,"metronome":false,"steps":[["Силна ли е кашлицата?","Ако бебето кашля или плаче силно, оставете го да кашля и го наблюдавайте внимателно.",null],["Викайте за помощ, обадете се на 112 на високоговорител","Пазете ръцете си свободни за бебето.",null],["До 5 удара по гърба","Положете бебето по корем върху предмишницата си, с главата по-ниско от тялото. Придържайте челюстта с пръсти (не натискайте мекото гърло). Удряйте силно между лопатките с основата на дланта.","back_blows_infant"],["До 5 гръдни тласъка","Обърнете бебето по гръб върху другата си предмишница, главата пак по-ниско. Два пръста на долната половина на гръдната кост (същото място като при КПР). Натиснете рязко надолу 5 пъти.","cpr_infant"],["Повтаряйте","Редувайте 5 удара по гърба и 5 гръдни тласъка. Проверете устата - махнете предмета само ако ясно го виждате.",null],["Ако бебето спре да реагира","Започнете КПР - вижте „Не диша (бебе)“, като започнете с 5 вдишвания.",null]],"when":["Предметът не излиза бързо","Бебето спре да реагира","След всякакви удари по гърба или гръдни тласъци - бебето се нуждае от лекарски преглед"],"dont":["Не правете коремни тласъци на бебе - може да увредят органите","Не бъркайте с пръсти в устата на сляпо","Не дръжте бебето с главата надолу за краката и не го разтърсвайте"]},{"id":"febrile","sev":"kids","title":"Фебрилен гърч (дете)","sub":"Гърч при висока температура, от 6 месеца до 5 години","recognize":"Дете на възраст от 6 месеца до 5 години с температура внезапно се вдървява, очите се превъртат, ръцете и краката потрепват и детето не реагира. Може да пребледнее или посинее. Обикновено спира до 1-2 минути.","call":false,"metronome":false,"steps":[["Запишете часа","Проследете колко продължава гърчът. Запазете спокойствие - повечето фебрилни гърчове спират сами и не причиняват вреда.",null],["Положете детето безопасно","Върху мека повърхност, на една страна, ако можете, далеч от твърди и остри предмети. Не го задържайте.",null],["Нищо в устата","Не слагайте пръсти, лъжица или каквото и да е в устата. Детето не може да си глътне езика.",null],["Обадете се на 112, ако е нужно","Обадете се, ако това е първият гърч, продължава повече от 5 минути или детето диша трудно. Ако лекар ви е дал спешно лекарство против гърчове, приложете го според указанията.",null],["Когато потрепването спре","Поставете детето на една страна (възстановително положение) и проверете дишането. Може да е сънливо или объркано до един час.","recovery"],["Не го прегрявайте","Свалете излишните дрехи и завивки. Поддържайте нормална стайна температура.",null],["Лекарство за температура, когато се събуди напълно","Когато детето е будно и може да преглъща, парацетамол или ибупрофен в дозата за възрастта или теглото му може да го облекчи.",null],["Покажете го на лекар","Всеки фебрилен гърч, дори кратък, трябва да бъде прегледан от лекар, за да се открие причината за температурата.",null]],"when":["Първи гърч в живота","Продължава повече от 5 минути","Скоро след това следва нов гърч","Затруднено дишане или устните остават сини след гърча","Не се събужда нормално до един час","Схванат врат или обрив, който не избледнява, когато притиснете чаша върху него","Бебе под 6 месеца"],"dont":["Не слагайте нищо в устата","Не задържайте и не разтърсвайте детето","Не слагайте детето в студена вана и не го разтривайте със студена вода или спирт","Не давайте храна, напитки или лекарства през устата, докато не се събуди напълно"]},{"id":"asthma","sev":"amber","title":"Астматичен пристъп","sub":"Свирене в гърдите, не може да си поеме дъх","recognize":"Човек с астма, който има свирене в гърдите, кашля, усеща стягане в гърдите и трудно диша или не може да говори с цели изречения.","call":false,"metronome":false,"steps":[["Настанете го седнал изправено","Седнал, леко наведен напред - не легнал. Разхлабете стегнатите дрехи и го успокойте.",null],["Помогнете му да използва облекчаващия си инхалатор","Обикновено синият. Разклатете го, после 1 впръскване на всеки 30-60 секунди, до 10 впръсквания. Използвайте спейсър (камера), ако има.",null],["Бавно дишане","Насърчете го да диша бавно и равномерно. Останете спокойни - паниката затруднява дишането.",null],["Няма подобрение след 10 впръсквания? Обадете се на 112","Обадете се веднага и ако се влошава, не може да говори от задух или устните му посиняват.",null],["Повторете, докато чакате","Ако помощта не е дошла до 10 минути, дайте още до 10 впръсквания по същия начин.",null],["Ако спре да реагира","Не диша нормално: започнете КПР (вижте „Не диша“).",null]],"when":["Няма подобрение след 10 впръсквания","Не може да говори, да яде или да спи от задух","Устните или върховете на пръстите посиняват или посивяват","Изтощен, сънлив или объркан","Няма инхалатор, а диша трудно"],"dont":["Не го слагайте да легне","Не слагайте хартиен плик на устата му","Не го оставяйте сам"]},{"id":"sugar","sev":"amber","title":"Ниска кръвна захар","sub":"Спешен случай при диабет","recognize":"Човек с диабет, който трепери, поти се, бледен е, объркан, раздразнителен или необичайно сънлив.","call":false,"metronome":false,"steps":[["В съзнание ли е и може ли да преглъща?","Ако не - вижте „В безсъзнание, но диша“ и се обадете на 112.",null],["Дайте бърза захар","Глюкозни таблетки, чаша сок или обикновена (не диетична) газирана напитка, или няколко бонбона.",null],["Изчакайте 10-15 минути","Нека седне и почива.",null],["Няма подобрение? Дайте захар отново","Повторете веднъж.",null],["Когато се почувства по-добре","Дайте закуска с бавни въглехидрати - хляб, бисквита, банан.",null]],"when":["В безсъзнание или не може да преглъща","Няма подобрение след 2 дози захар","Гърч"],"dont":["Не давайте храна или напитки на човек, който не може да преглъща безопасно","Не давайте инсулин"]},{"id":"seizure","sev":"amber","title":"Гърч","sub":"Конвулсии, епилептичен пристъп","recognize":"Внезапно вдървяване и потрепващи движения, може да падне, не осъзнава какво става около него.","call":false,"metronome":false,"steps":[["Запишете часа","Проследете колко продължава гърчът.",null],["Пазете го от нараняване","Махнете твърди и остри предмети. Подложете нещо меко под главата.",null],["Оставете гърча да мине","Не го удържайте. Разхлабете всичко стегнато около врата.",null],["След като тресенето спре","Проверете дишането и го поставете във възстановително положение.","recovery"],["Останете с него","Говорете спокойно - може да е объркан или сънлив известно време.",null]],"when":["Гърчът продължава повече от 5 минути","Следва нов гърч","Първи гърч в живота","Наранен, бременна, във вода или не идва в съзнание"],"dont":["Не слагайте нищо в устата му","Не задържайте движенията","Не давайте храна или напитки, докато не е напълно в съзнание"]},{"id":"snakebite","sev":"amber","title":"Ухапване от змия","sub":"Пепелянка, усойница","recognize":"Две малки точковидни рани, с болка, подуване и синина, които се разпространяват от мястото на ухапването. По-късно може да има гадене, повръщане, замайване, подуване на лицето или затруднено дишане. В България отровните змии са пепелянката и усойницата.","call":true,"metronome":false,"steps":[["Отдалечете се от змията","Не се опитвайте да я хванете или убиете. Ако е безопасно, снимайте я отдалеч - това помага на лекарите.",null],["Обадете се на 112","Всяко ухапване от пепелянка или усойница изисква преглед в болница, дори ако в началото не боли много.",null],["Дръжте го неподвижен и спокоен","Нека седне или легне. Движението разнася отровата по-бързо. Не го оставяйте да ходи, ако може да бъде пренесен или откаран.",null],["Свалете пръстени, часовник и стягащи неща","От ухапаната ръка или крак, преди да се подуе - включително обувките.",null],["Обездвижете крайника","Подпрете го с триъгълна превръзка или шина, приблизително на нивото на сърцето.",null],["Запишете часа и отбележете отока","Запишете кога е станало ухапването. Начертайте с химикалка линия по края на подуването и запишете часа до нея - лекарите така виждат колко бързо се разпространява.",null],["Следете за тежка реакция","Подуване на лицето, затруднено дишане или колапс: използвайте картата „Тежка алергична реакция“ или „Шок“. Не диша нормално: започнете КПР.",null]],"when":["Винаги - всяко ухапване от змия изисква преглед в болница","Дете, възрастен човек или ухапване по лицето или врата","Подуването се разпространява бързо, повръщане, замайване, припадък или затруднено дишане"],"dont":["Не разрязвайте раната и не изсмуквайте отровата","Не поставяйте турникет или стегната превръзка","Не слагайте лед върху ухапването","Не давайте алкохол, аспирин или ибупрофен","Не се опитвайте да хванете или убиете змията"]},{"id":"burn","sev":"amber","title":"Изгаряния","sub":"Топлина, вряла вода, огън","recognize":"Зачервена, болезнена кожа с мехури или бяла/овъглена кожа.","call":false,"metronome":false,"steps":[["Спрете изгарянето","Отдалечете се от източника на топлина.",null],["Охлаждайте с течаща вода 20 минути","Хладка или студена чешмяна вода, възможно най-скоро.",null],["Свалете бижута и дрехи","Около изгарянето - освен ако са залепнали за кожата.",null],["Покрийте свободно","Прозрачно фолио, положено отгоре (не увито стегнато), или чиста найлонова торбичка.",null],["Пазете човека топъл","Охлаждайте изгарянето, не човека - следете за треперене, особено при деца.",null]],"when":["По-голямо от дланта му","Лице, ръце, стъпала, гениталии или стави","Химическо или електрическо изгаряне","Бяла, овъглена или безболезнена кожа","Изгаряне при дете или възрастен човек"],"dont":["Не слагайте лед, масло, олио, паста за зъби или кремове","Не пукайте мехурите","Не слагайте памук директно върху изгарянето"]},{"id":"hypothermia","sev":"amber","title":"Хипотермия","sub":"Преохлаждане на тялото","recognize":"Бил е на студ или в студена вода. Трепери, кожата е бледа и студена, движи се несръчно, говорът е завален, объркан или сънлив е. При тежки случаи треперенето спира.","call":false,"metronome":false,"steps":[["Изведете го от студа","Вкарайте го на закрито или на завет. Пазете го от вятъра и подложете нещо под него, за да го изолирате от земята.",null],["Обадете се на 112 при сериозно състояние","Объркан, сънлив, със завален говор или вече не трепери - обадете се на 112 веднага.",null],["Местете го внимателно","Местете го внимателно и го дръжте легнал, ако е сънлив или много изстинал - резките движения могат да нарушат сърдечния ритъм.",null],["Сменете мокрите дрехи","Свалете мокрите дрехи и облечете сухи пластове. Покрийте главата и врата.",null],["Завийте го","Одеяла, спален чувал, палта, а най-отвън - изотермично одеяло (фолио). Контакт тяло до тяло под одеялата помага.",null],["Затоплете тялото в центъра","Топли (не горещи) компреси, увити в плат, на гърдите, подмишниците и слабините - не на ръцете и краката.",null],["Топла сладка напитка","Само ако е напълно в съзнание и може да преглъща. Какао или сладък чай - без алкохол.",null],["Ако не реагира","Проверявайте дишането до 1 минута - може да е много бавно. Диша: възстановително положение и продължете затоплянето. Не диша нормално: обадете се на 112 и започнете КПР.",null]],"when":["Объркан, сънлив или със завален говор","Спрял е да трепери, но още е студен","Не реагира","Изваден от студена вода","Възрастен човек или бебе, които са много изстинали","Не се затопля въпреки помощта"],"dont":["Не разтривайте и не масажирайте ръцете и краката","Не използвайте гореща вана, грейка директно върху кожата или печка близо до кожата","Не давайте алкохол","Не го карайте да ходи, ако е силно изстинал - местете го внимателно"]},{"id":"frostbite","sev":"amber","title":"Измръзване","sub":"Пръсти, уши, нос от студ","recognize":"След престой на студ пръстите на ръцете или краката, ушите, носът или бузите побеляват, посивяват или изглеждат восъчни, твърди и студени, с изтръпване и после без чувствителност. При затопляне може да се зачервят, да се подуят и да се появят мехури.","call":false,"metronome":false,"steps":[["Първо проверете за хипотермия","Трепери силно, объркан, сънлив или със завален говор? Първо използвайте картата „Хипотермия“ - цялото тяло е по-важно от пръстите.",null],["Отидете на топло","Влезте на закрито. Свалете мокрите дрехи и внимателно махнете пръстени, часовник и тесни обувки, преди да започне подуването.",null],["Не затопляйте, ако може да замръзне отново","Размразяването и повторното замръзване причиняват по-голяма вреда. Пазете мястото, докато стигнете там, където ще може да остане на топло.",null],["Затоплете в топла вода","Потопете мястото в топла вода - приятна за лакътя ви, около 37-39 °C, не гореща - за 20-30 минути, докато кожата омекне и цветът се върне. Нямате вода? Използвайте телесна топлина, например ръцете в подмишниците. Може да е много болезнено.",null],["Внимателно, без разтриване","Не разтривайте и не масажирайте кожата. Ако можете, не ходете с измръзнали крака.",null],["Подсушете и покрийте свободно","Подсушете с попиване, покрийте със свободна чиста превръзка и сложете марля или плат между пръстите. Дръжте крайника повдигнат. Парацетамол или ибупрофен облекчават болката.",null],["Потърсете медицинска помощ","Отидете на лекар при всичко повече от кожа, която се възстановява напълно за няколко минути - особено ако остава бяла, твърда или изтръпнала, или се появят мехури.",null]],"when":["Признаци на хипотермия - объркан, сънлив, завален говор","Кожата остава бяла, сива, синя или черна, или остава твърда след затопляне","Мехури, особено пълни с кръв","Засегнати са големи участъци или лицето"],"dont":["Не разтривайте със сняг или с ръце","Не затопляйте с огън, печка, сешоар или грейка","Не пукайте мехурите","Не затопляйте, ако може да замръзне отново","Не давайте алкохол и не му позволявайте да пуши"]},{"id":"head","sev":"amber","title":"Травма на главата","sub":"Удар в главата, мозъчно сътресение","recognize":"Удар в главата при падане, удар или злополука. Цицина, рана, главоболие, замайване, объркване или кратка загуба на съзнание.","call":false,"metronome":false,"steps":[["Дръжте го неподвижен","Ако може да има травма на врата (падане от височина, катастрофа, скок във вода), задръжте главата неподвижна на една линия с тялото и не го местете.",null],["Не реагира?","Обадете се на 112. Диша: поддържайте дихателните пътища отворени; обръщайте го само ако повърне. Не диша: КПР.",null],["Спрете кървенето","Раните по скалпа кървят силно. Притиснете с чиста кърпа. Ако напипате вдлъбнатина в черепа, натискайте около нея, не върху нея.",null],["Студен компрес на цицината","Увит в кърпа, 10-20 минути.",null],["Наблюдавайте го 24 часа","Не го оставяйте сам. Проверявайте дали се събужда лесно и отговаря нормално. Следете за опасните признаци по-долу.",null]],"when":["Загубил е съзнание, дори за кратко","Объркан, много сънлив или трудно се събужда","Повръща повече от веднъж","Гърч","Кръв или бистра течност от носа или ушите","Слабост, изтръпване, завален говор или замъглено зрение","Главоболието се засилва","Приема лекарства за разреждане на кръвта","Падане от височина или катастрофа","Бебе или малко дете с голяма цицина или което не се държи нормално"],"dont":["Не давайте алкохол или приспивателни","Не го оставяйте да шофира или да спортува същия ден","Не го местете, ако подозирате травма на врата"]},{"id":"eye","sev":"amber","title":"Травма на окото","sub":"Химикал, прашинка, удар в окото","recognize":"Химикал, прах или малък предмет е влязъл в окото, или окото е ударено или порязано. Болка, зачервяване, сълзене, замъглено зрение или окото не се отваря.","call":false,"metronome":false,"steps":[["Не търкайте окото","Търкането може да надраска окото или да вкара мръсотията по-навътре. Измийте ръцете си, преди да докосвате.",null],["Химикал? Изплаквайте веднага 20 минути","Започнете веднага - всяка секунда е важна. Дръжте окото отворено и изливайте чиста, хладка течаща вода от вътрешния ъгъл навън, за да не попада в другото око. Махнете контактните лещи, ако излизат лесно.",null],["После се обадете на 112","При всеки химикал в окото. Продължавайте да изплаквате, докато чакате, и запазете бутилката или опаковката, за да я покажете на екипа.",null],["Забит предмет в окото? Не го вадете","Не натискайте окото. Покрийте го свободно с хартиена чаша или чист тампон, помолете човека да държи двете очи възможно най-неподвижни и се обадете на 112.",null],["Прашинка или мигла? Мигане и изплакване","Нека примигне няколко пъти и изплакнете с чиста вода или физиологичен разтвор. Ако я виждате върху бялото на окото, вдигнете я внимателно с ъгълчето на чиста, влажна кърпа. Никога не докосвайте цветната част на окото.",null],["Удар в окото? Студен компрес без натиск","Студен компрес, увит в кърпа, притиснат леко към окото за 10-15 минути.",null],["Отидете на лекар","След всеки химикал, порязване или силен удар, или ако болката, зачервяването или замъгленото зрение не отминават скоро.",null]],"when":["Всеки химикал в окото - особено цимент, вар, белина или препарат за отпушване на канали","Забит предмет в окото","Порязване на окото или клепача","Внезапна загуба на зрение, проблясъци или тъмна завеса пред окото","Кръв вътре в окото или окото изглежда деформирано"],"dont":["Не търкайте и не натискайте окото","Не се опитвайте да вадите нещо, забито в окото","Не слагайте капки, мехлем, мляко или каквото и да е друго освен чиста вода в окото","Не докосвайте цветната част на окото"]},{"id":"animalbite","sev":"amber","title":"Ухапване от куче или животно","sub":"Куче, котка, диво животно","recognize":"Ухапване или дълбоко одраскване от куче, котка или друго животно - точковидни рани, разкъсана кожа или кървене. Бездомните кучета, лисиците, прилепите и другите диви животни носят най-голям риск от бяс.","call":false,"metronome":false,"steps":[["Отдалечете се от животното","Отидете на безопасно място. Не се опитвайте сами да хванете животното. Ако има стопанин, попитайте дали е ваксинирано срещу бяс.",null],["Силно кървене? Първо притиснете","Притиснете силно раната с чиста кърпа и се обадете на 112 (вижте „Силно кървене“).",null],["Измийте раната 15 минути","Със сапун и много течаща вода, дори ако ухапването е малко. Това е най-важната стъпка срещу бяс и инфекция.",null],["Дезинфекцирайте и покрийте","Нанесете антисептик (например йод) и покрийте с чиста превръзка. Не затваряйте раната с лепенки или лепило.",null],["Отидете на лекар още същия ден","При всяко ухапване, което е разкъсало кожата. Лекарят решава за ваксини срещу бяс и тетанус и за антибиотик - ваксината срещу бяс действа само ако започне рано.",null],["Запишете данни за животното","Какво животно, къде е станало, дали има стопанин и как да се свържете с него, и дали се е държало странно. Животно със стопанин обикновено се наблюдава 10 дни.",null],["Следете за инфекция","През следващите дни отидете отново на лекар, ако има разширяващо се зачервяване, подуване, затопляне, гной, червени ивици или температура.",null]],"when":["Кървене, което не спира при натиск","Много или дълбоки рани, особено при дете","Ухапване по лицето или врата","Бледа, студена, лепкава кожа или объркване (признаци на шок)"],"dont":["Не пренебрегвайте малко ухапване - дори малки рани могат да пренесат инфекция или бяс","Не затваряйте раната с лепенки, лента или лепило","Не се опитвайте да хванете или убиете животното","Не отлагайте прегледа - ваксината срещу бяс трябва да започне рано"]},{"id":"faint","sev":"teal","title":"Припадък","sub":"Кратка загуба на съзнание","recognize":"Чувства се замаян, бледен, изпотен, после пада за кратко.","call":false,"metronome":false,"steps":[["Положете го легнал","Ако му прималява, помогнете му да легне, преди да падне.",null],["Повдигнете краката","Около 30 см върху чанта или стол.",null],["Осигурете въздух","Разхлабете стегнатите дрехи, помолете хората да се отдръпнат, отворете прозорец.",null],["Изчакайте да се свести","Повечето хора идват на себе си до минута. Помогнете му да седне бавно.",null],["Ако не се свести","Проверете дишането: възстановително положение, ако диша, КПР, ако не диша. Обадете се на 112.",null]],"when":["Не идва в съзнание до 1-2 минути","Болка в гърдите, сърцебиене или припадък по време на усилие","Наранил се е при падането, бременна е или е над 50 години"],"dont":["Не го изправяйте рязко в седнало положение","Не го пръскайте с вода и не го удряйте по лицето"]},{"id":"fracture","sev":"teal","title":"Счупване","sub":"Фрактура, навяхване","recognize":"Болка, подуване, синина, необичайна форма или ъгъл, не може да движи крайника.","call":false,"metronome":false,"steps":[["Дръжте го неподвижно","Подпрете наранената част в положението, в което сте я намерили.",null],["Спрете кървенето","Ако костта е излязла през кожата, притиснете около нея с чиста кърпа - не върху костта.",null],["Обездвижете","С подложки, триъгълна превръзка (за ръка) или привържете към другия крак с подложка между тях.",null],["Студен компрес","Лед, увит в кърпа, 10-20 минути. Никога лед директно върху кожата.",null],["Потърсете медицинска помощ","В болница за рентген. Обадете се на 112 при големи кости или ако човекът не може да бъде преместен.",null]],"when":["Костта е излязла през кожата","Травма на бедрото, таза, врата или гърба","Крайникът под травмата е студен, бледен или изтръпнал"],"dont":["Не се опитвайте да наместите костта","Не давайте храна или напитки (може да е нужна операция)","Не го местете, ако подозирате травма на врата или гърба"]},{"id":"nosebleed","sev":"teal","title":"Кървене от носа","sub":"Кръв от носа","recognize":"Кръв тече от едната или от двете ноздри.","call":false,"metronome":false,"steps":[["Седнете и се наведете напред","Така кръвта изтича от носа, а не надолу по гърлото.",null],["Притиснете меката част на носа","Точно под костта. Дишайте през устата.",null],["Задръжте 10-15 минути","Без да пускате, за да проверите. Гледайте часовника.",null],["Изплювайте кръвта","Погълнатата кръв може да предизвика повръщане.",null],["Още кърви? Още 10 минути","Студен компрес на основата на носа може да помогне.",null],["След като спре","Не издухвайте и не бъркайте в носа и избягвайте тежки усилия 24 часа.",null]],"when":["Кърви повече от 20 минути","След удар в главата или лицето","Много силно кървене или затруднено дишане","Приема лекарства за разреждане на кръвта"],"dont":["Не накланяйте главата назад","Не лягайте","Не натъпквайте салфетка дълбоко в носа"]},{"id":"cuts","sev":"teal","title":"Порязвания и охлузвания","sub":"Малки рани, ожулвания","recognize":"Малко порязване, драскотина или охлузване, което кърви слабо. Ако кръвта шурти или попива през превръзката, използвайте картата „Силно кървене“.","call":false,"metronome":false,"steps":[["Измийте ръцете си","Сложете ръкавици, ако имате.",null],["Спрете кървенето","Притиснете раната с чиста кърпа или марля за 5-10 минути. Повдигнете я, ако е на ръка или крак.",null],["Почистете раната","Изплакнете под чиста течаща чешмяна вода. Внимателно измийте пръстта и камъчетата - особено от охлузване, за да не се инфектира.",null],["Подсушете и покрийте","Подсушете кожата около раната с попиване. Може да нанесете антисептик, после покрийте с лепенка или незалепваща превръзка.",null],["Сменяйте превръзката","Всеки ден или по-рано, ако се намокри или замърси. Пазете раната чиста и суха.",null],["Трябват ли шевове?","Отидете на лекар до няколко часа, ако краищата зеят, раната е дълбока или по-дълга от около 2 см, или е на лицето, на става или на ръката.",null],["Тетанус","Замърсена рана (пръст, ръжда, животно) и нямате ваксина срещу тетанус през последните 5 години или не сте сигурни? Отидете на лекар за реимунизация.",null],["Следете за инфекция","Отидете на лекар, ако зачервяването се разширява, раната се подуе, затопли, има гной или червени ивици, или се вдигне температура.",null]],"when":["Кървенето не спира след 10 минути силен натиск","Кръвта шурти","Нещо е забито дълбоко в раната"],"dont":["Не слагайте памук директно върху раната - влакната залепват","Не наливайте спирт или кислородна вода в раната","Не вадете предмет, забит дълбоко в раната - натискайте около него","Не духайте върху раната"]},{"id":"tick","sev":"teal","title":"Ухапване от кърлеж","sub":"Кърлеж, забит в кожата","recognize":"Малко тъмно насекомо, здраво забито в кожата - често в подмишниците, слабините, зад коленете или ушите, на кръста или по главата на дете.","call":false,"metronome":false,"steps":[["Махнете го възможно най-скоро","Колкото по-дълго е прикрепен кърлежът, толкова по-голям е рискът от инфекция.",null],["Хванете го близо до кожата","С тънка пинсета или кърлежовадка. Хванете кърлежа за главата, възможно най-близо до кожата - не за тялото.",null],["Издърпайте го право навън, бавно и равномерно","Не го въртете и не дърпайте рязко. Ако ползвате кукичка или картичка за кърлежи, следвайте нейните указания.",null],["Остана част в кожата?","Опитайте да я махнете с пинсетата. Ако не става лесно, оставете я - кожата ще я изтласка, докато заздравява.",null],["Почистете ухапването и ръцете си","Със сапун и вода или с антисептик.",null],["Запишете датата","Запишете датата и къде по тялото е било ухапването. Прегледайте цялото тяло за други кърлежи, включително при децата и домашните любимци.",null],["Наблюдавайте мястото 30 дни","Отидете на лекар, ако около ухапването се появи разширяващо се зачервяване (често като кръг или „мишена“), тъмно петно на мястото на ухапването, или температура, главоболие, болки в мускулите или отпадналост.",null]],"when":["Висока температура с кървене от венците или носа, или необичайни синини","Силно главоболие, схванат врат или объркване","Подуване на лицето или затруднено дишане"],"dont":["Не стискайте и не смачквайте тялото на кърлежа","Не слагайте олио, масло, спирт или лак за нокти върху кърлежа и не го палете","Не ровете дълбоко в кожата за останали части"]},{"id":"tape","sev":"teal","title":"Кинезио тейп","sub":"Навяхване или разтягане: глезен, коляно, китка, рамо, кръст","recognize":"При леко навяхване (изкълчена става) или разтягане (разтегнат мускул) след първата проверка. Тейпът може да даде облекчение и усещане за опора, но не лекува травмата - доказателствата, че ускорява възстановяването, са ограничени.","call":false,"metronome":false,"steps":[["Първо: навяхване, а не счупване?","Отидете на лекар преди тейпирането, ако не можете да стъпите на крака или да направите 4 крачки, самата кост боли при натиск, ставата изглежда деформирана, или има силно подуване или синина.",null],["Първите 48 часа: покой, студ, опора, повдигане","Оставете ставата в покой. Студен компрес, увит в кърпа, за 10-20 минути на всеки 2-3 часа. Еластичен бинт за опора. Дръжте крайника повдигнат.",null],["Подгответе кожата и тейпа","Кожата да е чиста, суха и без крем; подстрижете гъстите косми. Измерете лентите върху разтегнатата става, изрежете ги и заоблете ъглите с ножица, за да не се отлепят. Сложете тейпа 30-60 минути преди спорт или душ.",null],["Основното правило: краищата без опъване","Залепете първите 3-5 см (котвата) без опъване. Опъвайте само средната част. Залепете последните 3-5 см отново без опъване. Никога не увивайте тейпа изцяло около ръката или крака. Разтрийте го силно няколко секунди - топлината активира лепилото.",null],["Глезен","При честото навяхване навън (стъпалото се е подвило навътре). Стъпалото под прав ъгъл. Лента 1 (слага се първа): къса лента около 10 см, центрирана върху болното място точно пред и под външната глезенна кост, с половин до три четвърти опъване в средата. Лента 2 (стреме): от вътрешната страна на подбедрицата, около една длан над глезенната кост, надолу под петата и нагоре по външната страна, с около половин опъване над външната глезенна кост. Лента 3 (заключване на петата): от предната част на глезена, диагонално надолу зад петата и под нея, после обратно нагоре отпред, с леко опъване. Направете същото и от другата страна, така че двете ленти да се кръстосат зад петата.","tape_ankle"],["Коляно","Седнете със свито коляно. Срежете лента около 30 см по средата, като оставите 5 см несрязани (буква Y). Залепете несрязания край отпред на бедрото, около една длан над капачката. Прекарайте двете опашки от двете страни на капачката с леко опъване и залепете краищата под нея. По желание: къса лента напряко точно под капачката, с половин опъване в средата. Боли отвътре или отвън на коляното? Първо поставете две къси ленти на X върху болезнената страна, кръстосани на нивото на ставата, с половин опъване в средата - после Y-лентата отгоре.","tape_knee"],["Китка","Свийте китката надолу, с дланта към пода. Лента 1: от гърба на дланта, точно под кокалчетата, по задната страна на предмишницата около 15 см, с леко опъване. Лента 2: напряко през задната страна на китката, с половин опъване в средата, краищата отстрани - да не се срещат от страната на дланта.","tape_wrist"],["Рамо","Седнете с отпусната ръка. Изрежете Y-лента около 25 см. Залепете несрязания край на външната страна на мишницата, около една трета надолу. Преместете ръката назад и поставете предната опашка по предната страна на рамото до върха му. Преместете ръката напред пред гърдите и поставете задната опашка по задната страна на рамото до върха. Леко опъване и на двете опашки.","tape_shoulder"],["Кръст","Наведете се напред, колкото ви е удобно. Залепете две ленти по около 25 см, по една от двете страни на гръбначния стълб (върху мускулите, не върху костта), от точно над седалището нагоре, с леко опъване. По желание: къса лента напряко на най-болезненото място, с половин опъване в средата.","tape_back"],["Носене и сваляне","Тейпът може да остане 3-5 дни и може да се къпете - подсушете го с попиване. Сваляйте го бавно по посока на окосмяването, като притискате кожата до него; ако го напоите с олио преди това, става по-лесно. Махнете го веднага, ако кожата сърби, пари или изтръпва, или болката се засили.",null]],"when":["Костта е излязла през кожата или ставата изглежда деформирана","Ръката или кракът под травмата е студен, бледен или изтръпнал"],"dont":["Не слагайте тейп върху рани, наранена или раздразнена кожа, или при съмнение за счупване","Не увивайте тейпа изцяло около крайника","Не опъвайте краищата на лентите","Не го използвайте, ако сте алергични към лепенки или лепило","Не използвайте тейп вместо лекар при тежка травма"]}]},"sev":{"en":{"red":{"label":"Life-threatening - call 112 first","color":"#C8102E"},"kids":{"label":"Babies and children - call 112 first","color":"#C8102E"},"amber":{"label":"Urgent","color":"#F2A516","ink":"#B45A00"},"teal":{"label":"Common","color":"#11695A"}},"bg":{"red":{"label":"Животозастрашаващо - първо се обадете на 112","color":"#C8102E"},"kids":{"label":"Бебета и деца - първо се обадете на 112","color":"#C8102E"},"amber":{"label":"Спешно","color":"#F2A516","ink":"#B45A00"},"teal":{"label":"Често срещани","color":"#11695A"}}},"ui":{"en":{"brand":"First Aid","start_here":"🆘 Don't know what's wrong? Start here","search":"🔍 What happened? e.g. burn, choking","no_match":"Nothing matches “{q}”. If someone is in danger, call 112 now.","note":"For guidance only - it doesn't replace a first aid course or the 112 operator. Follow the operator's instructions when you call.","all_situations":"‹ All situations","urgent":"Call 112 now, then follow the steps.","call":"Call 112","mode_all":"All steps","mode_one":"One at a time","step_of":"Step {i} of {n}","back":"Back","next":"Next","when":"Call 112 if","dont":"Don't","cancel":"‹ Cancel","tri_note":"Not sure? Call 112 - the operator will guide you.","beat_start":"▶ Compression beat","beat_stop":"■ Stop beat","beat_hint":"110 per minute - push on each beat"},"bg":{"brand":"Първа помощ","start_here":"🆘 Не \" r=\"42\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <path d=\"M112 116 Q112 98 132 96 L208 96 Q228 98 228 116 L220 240 L120 240 Z\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <circle cx=\"146\" cy=\"128\" r=\"3.5\" fill=\"#51605A\"/>\n  <circle cx=\"194\" cy=\"128\" r=\"3.5\" fill=\"#51605A\"/>\n  <line x1=\"116\" y1=\"128\" x2=\"224\" y2=\"128\" stroke=\"#C8102E\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n  <rect x=\"159\" y=\"134\" width=\"9\" height=\"30\" rx=\"4.5\" fill=\"#11695A\" fill-opacity=\"0.85\" stroke=\"#0B4A3F\" stroke-width=\"2\"/>\n  <rect x=\"171\" y=\"134\" width=\"9\" height=\"30\" rx=\"4.5\" fill=\"#11695A\" fill-opacity=\"0.85\" stroke=\"#0B4A3F\" stroke-width=\"2\"/>\n  <line x1=\"224\" y1=\"128\" x2=\"250\" y2=\"116\" stroke=\"#13201B\" stroke-width=\"1.5\"/>\n  <text x=\"252\" y=\"112\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#51605A\">Nipple line<\/text>\n  <line x1=\"182\" y1=\"150\" x2=\"250\" y2=\"156\" stroke=\"#13201B\" stroke-width=\"1.5\"/>\n  <text x=\"252\" y=\"154\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#13201B\">2 fingers,<\/text>\n  <text x=\"252\" y=\"172\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#13201B\">just below<\/text><text x=\"170\" y=\"272\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">Press about 4 cm (one third of the chest).<\/text><text x=\"170\" y=\"292\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">Same spot for chest thrusts when choking.<\/text><\/svg>","abdominal":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 304\" role=\"img\"><title>Abdominal thrust hand position<\/title>\n  <circle cx=\"170\" cy=\"36\" r=\"26\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <rect x=\"158\" y=\"58\" width=\"24\" height=\"16\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <path d=\"M92 86 Q92 70 114 68 L226 68\n           Q248 70 248 86 L232 240 L108 240 Z\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <circle cx=\"135\" cy=\"118\" r=\"4\" fill=\"#51605A\"/>\n  <circle cx=\"205\" cy=\"118\" r=\"4\" fill=\"#51605A\"/>\n  <line x1=\"170\" y1=\"78\" x2=\"170\" y2=\"160\" stroke=\"#51605A\" stroke-width=\"2\" stroke-dasharray=\"3 4\"/>\n  <circle cx=\"170\" cy=\"212\" r=\"4\" fill=\"#51605A\"/>\n  <circle cx=\"170\" cy=\"182\" r=\"17\" fill=\"#11695A\" fill-opacity=\"0.85\" stroke=\"#0B4A3F\" stroke-width=\"2\"/>\n  <path d=\"M146 192 Q170 210 194 192\" fill=\"none\" stroke=\"#0B4A3F\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-opacity=\"0.7\"/>\n  <line x1=\"152\" y1=\"178\" x2=\"30\" y2=\"178\" stroke=\"#13201B\" stroke-width=\"1.5\"/>\n  <text x=\"10\" y=\"170\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#13201B\">Fist<\/text>\n  <line x1=\"166\" y1=\"212\" x2=\"30\" y2=\"226\" stroke=\"#13201B\" stroke-width=\"1.5\"/>\n  <text x=\"10\" y=\"222\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#51605A\">Belly<\/text>\n  <text x=\"10\" y=\"237\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#51605A\">button<\/text>\n  <path d=\"M272 220 L272 164\" stroke=\"#C8102E\" stroke-width=\"4\"/>\n  <path d=\"M262 176 L272 160 L282 176\" fill=\"none\" stroke=\"#C8102E\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n  <text x=\"286\" y=\"194\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#13201B\">In<\/text>\n  <text x=\"286\" y=\"212\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#13201B\">and up<\/text><text x=\"170\" y=\"272\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">Stand behind. Fist just above the belly button,<\/text><text x=\"170\" y=\"292\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">other hand over it. Pull sharply in and up.<\/text><\/svg>","back_blows":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 304\" role=\"img\"><title>Back blow position<\/title>\n  <circle cx=\"170\" cy=\"36\" r=\"26\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <rect x=\"158\" y=\"58\" width=\"24\" height=\"16\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <path d=\"M92 86 Q92 70 114 68 L226 68 Q248 70 248 86 L232 240 L108 240 Z\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <path d=\"M124 92 Q132 132 150 124\" fill=\"none\" stroke=\"#51605A\" stroke-width=\"2.5\"/>\n  <path d=\"M216 92 Q208 132 190 124\" fill=\"none\" stroke=\"#51605A\" stroke-width=\"2.5\"/>\n  <line x1=\"170\" y1=\"76\" x2=\"170\" y2=\"236\" stroke=\"#51605A\" stroke-width=\"2\" stroke-dasharray=\"3 4\"/>\n  <ellipse cx=\"170\" cy=\"108\" rx=\"24\" ry=\"20\" fill=\"#11695A\" fill-opacity=\"0.85\" stroke=\"#0B4A3F\" stroke-width=\"2\"/>\n  <circle cx=\"170\" cy=\"108\" r=\"36\" fill=\"none\" stroke=\"#C8102E\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\n  <line x1=\"206\" y1=\"112\" x2=\"262\" y2=\"132\" stroke=\"#13201B\" stroke-width=\"1.5\"/>\n  <text x=\"262\" y=\"150\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#13201B\">Heel of<\/text>\n  <text x=\"262\" y=\"168\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#13201B\">the hand<\/text><text x=\"170\" y=\"272\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">Seen from behind: firm blows<\/text><text x=\"170\" y=\"292\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">between the shoulder blades.<\/text><\/svg>","back_blows_infant":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 306\" role=\"img\"><title>Baby back blows: face down along the forearm<\/title>\n  <line x1=\"318\" y1=\"206\" x2=\"96\" y2=\"222\" stroke=\"#CBD5D1\" stroke-width=\"34\" stroke-linecap=\"round\"/>\n  <line x1=\"300\" y1=\"126\" x2=\"78\" y2=\"174\" stroke=\"#7F948C\" stroke-width=\"30 \" x2=\"85\" y2=\"180\" stroke=\"#11695A\" stroke-opacity=\"0.9\" stroke-width=\"13\" stroke-linecap=\"round\"/>\n  <line x1=\"60\" y1=\"122\" x2=\"110\" y2=\"122\" stroke=\"#E09A12\" stroke-opacity=\"0.95\" stroke-width=\"11\" stroke-linecap=\"round\"/>\n  <g stroke=\"#FFFFFF\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <line x1=\"77\" y1=\"122\" x2=\"93\" y2=\"122\"/>\n    <polyline points=\"81,118.5 76,122 81,125.5\"/>\n    <polyline points=\"89,118.5 94,122 89,125.5\"/>\n  <\/g>\n  <circle cx=\"36\" cy=\"44\" r=\"11\" fill=\"#11695A\"/><text x=\"36\" y=\"49\" font-family=\"Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1<\/text>\n  <circle cx=\"134\" cy=\"122\" r=\"11\" fill=\"#E09A12\"/><text x=\"134\" y=\"127\" font-family=\"Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2<\/text>\n  <text x=\"85\" y=\"250\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#51605A\">Гръб на дланта<\/text>\n\n  <path d=\"M175,70 L255,68 C282,70 298,98 304,140 C307,160 307,185 302,200 C298,206 290,204 289,196 C287,175 284,155 280,140 C274,122 262,110 250,108 L175,110 Z\" fill=\"#E3EAE7\"/>\n  <path d=\"M175,70 L255,68 C282,70 298,98 304,140 C307,160 307,185 302,200 C298,206 290,204 289,196 C287,175 284,155 280,140 C274,122 262,110 250,108 L175,110\" fill=\"none\" stroke=\"#51605A\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n  <ellipse cx=\"277\" cy=\"125\" rx=\"16\" ry=\"6.5\" transform=\"rotate(52 277 125)\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\n  <path d=\"M299,133 C294,100 281,79 258,76 L200,77\" fill=\"none\" stroke=\"#11695A\" stroke-opacity=\"0.9\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  <line x1=\"262\" y1=\"73\" x2=\"262\" y2=\"95\" stroke=\"#E09A12\" stroke-opacity=\"0.95\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  <line x1=\"26 iddle\">1<\/text>\n  <text x=\"255\" y=\"250\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#51605A\">Отгоре<\/text><text x=\"170\" y=\"278\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">Y-лента: основата отвън на мишницата,<\/text><text x=\"170\" y=\"298\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">опашките отпред и отзад на рамото.<\/text><text x=\"170\" y=\"318\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">Ръката назад за предната, напред за задната.<\/text><\/svg>","tape_back":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 350\" role=\"img\"><title>Кинезио тейп на кръста, отзад и отстрани<\/title>\n  <line x1=\"170\" y1=\"8\" x2=\"170\" y2=\"236\" stroke=\"#CBD5D1\" stroke-width=\"2\" stroke-dasharray=\"4 5\"/>\n\n  <path d=\"M14,40 C14,14 40,4 60,2 L110,2 C130,4 156,14 156,40 C156,80 140,110 136,150 C134,175 146,195 146,236 L24,236 C24,195 36,175 34,150 C30,110 14,80 14,40 Z\" fill=\"#E3EAE7\"/>\n  <path d=\"M14,40 C14,14 40,4 60,2 M14,40 C14,80 30,110 34,150 C36,175 24,195 24,236\" fill=\"none\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <path d=\"M110,2 C130,4 156,14 156,40 C156,80 140,110 136,150 C134,175 146,195 146,236\" fill=\"none\" stroke=\"#51605A\" stroke-width=\"3\"/>\n  <line x1=\"85\" y1=\"14\" x2=\"85\" y2=\"200\" stroke=\"#51605A\" stroke-width=\"2\" stroke-dasharray=\"3 4\"/>\n  <path d=\"M40,212 C56,202 76,202 85,212 C94,202 114,202 130,212 M85,212 L85,236\"\n        fill=\"none\" stroke=\"#51605A\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n  <line x1=\"69\" y1=\"98\" x2=\"69\" y2=\"194\" stroke=\"#11695A\" stroke-opacity=\"0.9\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n  <line x1=\"101\" y1=\"98\" x2=\"101\" y2=\"194\" stroke=\"#11695A\" stroke-opacity=\"0.9\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n  <line x1=\"52\" y1=\"150\" x2=\"118\" y2=\"150\" stroke=\"#E09A12\" stroke-opacity=\"0.95\" stroke-width=\"11\" stroke-linecap=\"round\"/>\n  <g stroke=\"#FFFFFF\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <line x1=\"77\" y1=\"150\" x2=\"93\" y2=\"150\"/>\n    <polyline points=\"81,146.5 76,150 81,153.5\"/>\n    <polyline points=\"89,146.5 94,150 89,153.5\"/>\n  <\/g>\n  <circle cx=\"69\" cy=\"80\" r=\"11\" fill=\"#11695A\"/><text x=\"69\" y=\"85\" font-family=\"Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1<\/text>\n  <circle cx=\"101\" cy=\"80\" r=\"11\" fill=\"#11695A\"/><text x=\"101\" y=\"85\" font-family=\"Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1<\/text>\n  <circle cx=\"138\" cy=\"150\" r=\"11\" fill=\"#E09A12\"/><text x=\"138\" y=\"155\" font-family=\"Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2<\/text>\n  <text x=\"85\" y=\"250\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#51605A\">Отзад<\/text>\n\n  <rect x=\"232\" y=\"230\" width=\"38\" height=\"9\" rx=\"4.5\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\n  <path d=\"M226,141 L282,85 C290,77 304,79 310,90 C314,98 314,106 310,113 L254,169 L256,236 L236,236 L232,178 C222,168 220,152 226,141 Z\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\n  <circle cx=\"316\" cy=\"98\" r=\"15\" fill=\"#E3EAE7\" stroke=\"#51605A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\n  <line x1=\"293\" y1=\"104\" x2=\"297\" y2=\"168\" stroke=\"#51605A\" stroke-width=\"16\" stroke-linecap=\"round\"/>\n  <line x1=\"293\" y1=\"104\" x2=\"297\" y2=\"168\" stroke=\"#E3EAE7\" stroke-width=\"11\" stroke-linecap=\"round\"/>\n  <line x1=\"233\" y1=\"143\" x2=\"270\" y2=\"106\" stroke=\"#11695A\" stroke-opacity=\"0.9\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  <circle cx=\"236\" cy=\"110\" r=\"11\" fill=\"#11695A\"/><text x=\"236\" y=\"115\" font-family=\"Arial, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1<\/text>\n  <text x=\"255\" y=\"250\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#51605A\">Наведен напред<\/text><text x=\"170\" y=\"278\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">Наведете се напред. Две ленти по мускулите<\/text><text x=\"170\" y=\"298\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">от двете страни на гръбнака, от седалището<\/text><text x=\"170\" y=\"318\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">нагоре, с леко опъване. Лента 2 е по желание:<\/text><text x=\"170\" y=\"338\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"#51605A\">напряко на болното място, половин опъване.<\/text><\/svg>"}}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let lang = 'bg';
try { lang = localStorage.getItem('lang') || 'bg'; } catch (e) {}
let query = '', mode = 'all', step = 0, done = {};

const T = () => D.ui[lang];
const cardsNow = () => D.cards[lang];
const cardById = id => cardsNow().find(c => c.id === id);

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  render();
}

// ---------- navigation: the address (#...) changes, so the phone's Back button works ----------
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function openCard(id) { step = 0; go('#/card/' + id); }
function triageGo(target) {
  if (target.startsWith('card:')) openCard(target.slice(5));
  else if (target === 'list') go('#');
  else go('#/triage/' + target);
}
window.addEventListener('hashchange', render);

function topbar() {
  return `<div class="topbar"><div class="brand"><span class="logo">+</span>${esc(T().brand)}</div>
    <a class="call" href="tel:112">📞 112</a></div>
    <div class="lang"><button data-lang="bg" class="${lang === 'bg' ? 'on' : ''}">Български</button>
    <button data-lang="en" class="${lang === 'en' ? 'on' : ''}">English</button></div>`;
}

// ---------- home ----------
function tilesHTML() {
  const q = query.trim().toLowerCase();
  const found = cardsNow().filter(c => !q || (c.title + ' ' + c.sub + ' ' + D.search[c.id]).toLowerCase().includes(q));
  let out = found.length ? '' : `<div class="warn">${esc(T().no_match.replace('{q}', query.trim()))}</div>`;
  for (const [sev, meta] of Object.entries(D.sev[lang])) {
    const group = found.filter(c => c.sev === sev);
    if (!group.length) continue;
    out += `<div class="group"><i style="background:${meta.color}"></i>${esc(meta.label)}</div><div class="tiles">` +
      group.map(c => `<button class="big" data-card="${c.id}" title="${esc(c.sub)}">${esc(c.title)}</button>`).join('') + '</div>';
  }
  return out;
}

function renderHome() {
  app.innerHTML = topbar() +
    `<button class="big primary" data-tri="start">${esc(T().start_here)}</button>
     <input class="search" type="search" placeholder="${esc(T().search)}" value="${esc(query)}" aria-label="Search">
     <div id="tiles">${tilesHTML()}</div>
     <p class="note">${esc(T().note)}</p>`;
  app.querySelector('.search').addEventListener('input', e => {
    query = e.target.value;
    document.getElementById('tiles').innerHTML = tilesHTML();
  });
}

// ---------- start here ----------
function renderTriage(node) {
  const [question, hint, answers] = D.triage[lang][node];
  app.innerHTML = topbar() +
    `<button class="big back" data-tri="list">${esc(T().cancel)}</button>
     <div class="tq">${esc(question)}</div>${hint ? `<div class="tq-hint">${esc(hint)}</div>` : ''}` +
    answers.map(([label, target]) => `<button class="big" data-tri="${esc(target)}">${esc(label)}</button>`).join('') +
    `<p class="note">${esc(T().tri_note)}</p>`;
}

// ---------- situation card ----------
function pic(key) {
  const svg = key && D.pics[lang][key];
  return svg ? `<div class="pic"><img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}"></div>` : '';
}

function renderCard(c) {
  const color = D.sev[lang][c.sev].color;
  const ink = D.sev[lang][c.sev].ink || color;       // darker shade for the big step number
  const d = done[c.id] = done[c.id] || {};
  let html = topbar() +
    `<button class="big back" data-tri="list">${esc(T().all_situations)}</button>
     <div class="dhead" style="--c:${color}"><h1>${esc(c.title)}</h1><p>${esc(c.recognize)}</p></div>`;
  if (c.call) html += `<div class="urgent">${esc(T().urgent)}<a class="call" href="tel:112">${esc(T().call)}</a></div>`;
  if (c.metronome) html += `<div class="beat"><button id="beat">${esc(beatOn ? T().beat_stop : T().beat_start)}</button>
      <div class="dot" id="dot"></div><span>${esc(T().beat_hint)}</span></div>`;
  html += `<div class="modes"><button data-mode="all" class="${mode === 'all' ? 'on' : ''}">${esc(T().mode_all)}</button>
      <button data-mode="one" class="${mode === 'one' ? 'on' : ''}">${esc(T().mode_one)}</button></div>`;
  if (mode === 'all') {
    html += c.steps.map(([title, desc, key], i) =>
      `<div class="step ${d[i] ? 'done' : ''}"><label><input type="checkbox" data-done="${i}" ${d[i] ? 'checked' : ''}>
        <span>${i + 1}. ${esc(title)}</span></label><div class="stepdesc">${esc(desc)}</div>${pic(key)}</div>`).join('');
  } else {
    const i = Math.min(step, c.steps.length - 1), [title, desc, key] = c.steps[i];
    html += `<div class="step guide" style="--c:${ink}"><div class="count">${esc(T().step_of.replace('{i}', i + 1).replace('{n}', c.steps.length))}</div>
      <div class="num">${i + 1}</div><div class="title">${esc(title)}</div><div class="desc">${esc(desc)}</div>${pic(key)}
      <div class="nav"><button data-step="-1" ${i === 0 ? 'disabled' : ''}>${esc(T().back)}</button>
      <button class="primary" data-step="1" ${i === c.steps.length - 1 ? 'disabled' : ''}>${esc(T().next)}</button></div></div>`;
  }
  html += box('red', T().when, c.when) + box('amber', T().dont, c.dont);
  app.innerHTML = html;
  const b = document.getElementById('beat');
  if (b) b.addEventListener('click', toggleBeat);
}
const box = (kind, title, items) =>
  `<div class="box ${kind}"><h3>${esc(title)}</h3><ul>${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;

// ---------- CPR beat: 110 per minute ----------
let beatOn = null, ctx = null;
function tick() {
  const dot = document.getElementById('dot');
  if (dot) { dot.style.opacity = 1; setTimeout(() => dot.style.opacity = .25, 120); }
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.25, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .08);
  o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .09);
}
function toggleBeat() {
  if (beatOn) { stopBeat(); } else {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume();
    tick(); beatOn = setInterval(tick, 60000 / 110);
  }
  const b = document.getElementById('beat');
  if (b) b.textContent = beatOn ? T().beat_stop : T().beat_start;
}
function stopBeat() { if (beatOn) { clearInterval(beatOn); beatOn = null; } }

// keep the screen on while a card is open (helps during CPR); quietly skipped where unsupported
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
    if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && location.hash.startsWith('#/card/')) keepAwake(true); });

// ---------- one click handler for everything ----------
app.addEventListener('click', e => {
  const t = e.target.closest('button, input[type=checkbox]');
  if (!t) return;
  if (t.dataset.lang) return setLang(t.dataset.lang);
  if (t.dataset.card) return openCard(t.dataset.card);
  if (t.dataset.tri) return triageGo(t.dataset.tri);
  if (t.dataset.mode) { mode = t.dataset.mode; return render(); }
  if (t.dataset.step) { step = Math.max(0, step + Number(t.dataset.step)); render(); return window.scrollTo(0, 0); }
  if (t.dataset.done !== undefined) {
    const id = location.hash.split('/')[2];
    done[id][t.dataset.done] = t.checked;
    t.closest('.step').classList.toggle('done', t.checked);
  }
});

function render() {
  document.documentElement.lang = lang;
  const [, view, arg] = location.hash.split('/');
  const card = view === 'card' && cardById(arg);
  if (!card) stopBeat();
  keepAwake(!!card);
  if (card) renderCard(card);
  else if (view === 'triage' && D.triage[lang][arg]) renderTriage(arg);
  else renderHome();
}
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
